<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFF data visuals</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf2;        /* warm white */
    --panel: #ffffff;
    --line: #eceef0;
    --muted: #555;
    --accent: #fef751;    /* BFF yellow */
    --side: 280px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; color: #000; background: var(--bg); }

  /* ---------- layout: side panel + main area ---------- */
  .app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  aside {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .brand { padding: 20px 18px 12px; }
  .brand h1 { font-size: 20px; font-weight: 800; margin: 0 0 2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .search { padding: 0 14px 10px; }
  .search input {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid #d0d3d6; border-radius: 8px; background: #fff;
  }
  nav { padding: 0 8px 16px; flex: 1; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
  nav a {
    display: block; padding: 8px 10px; margin: 1px 0; border-radius: 8px;
    color: #000; text-decoration: none; font-size: 14px; line-height: 1.3;
  }
  nav a small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  nav a:hover { background: #f5f5f5; }
  nav a.active { background: var(--accent); font-weight: 600; }
  nav .vid { font-weight: 700; }
  /* A graphic with several versions: button + pop-out menu */
  .parent {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; text-align: left;
    padding: 8px 10px; margin: 1px 0; border: 0; border-radius: 8px; background: transparent;
    font: inherit; font-size: 14px; line-height: 1.3; color: #000; cursor: pointer; white-space: normal;
  }
  .parent small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; font-weight: 400; }
  .parent:hover, .parent[aria-expanded="true"] { background: #f5f5f5; }
  .parent.active { background: var(--accent); font-weight: 600; }
  .parent .chev { font-size: 18px; color: var(--muted); }
  .flyout {
    display: none; position: fixed; z-index: 50; width: 270px; padding: 6px;
    background: #fff; border: 1px solid #d9dcdf; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.14);
  }
  .flyout.open { display: block; }
  .flyout::before { content: ""; position: absolute; left: -10px; top: 0; bottom: 0; width: 10px; } /* hover bridge */
  .fly-head { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 4px; }
  .versions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .versions a { font-size: 12.5px; padding: 4px 10px; border: 1px solid #c9ced4; border-radius: 999px; color: #000; text-decoration: none; background: #fff; }
  .versions a.on { background: var(--accent); border-color: #000; }
  nav .empty { padding: 10px; font-size: 13px; color: var(--muted); }
  .side-foot { border-top: 1px solid var(--line); padding: 10px 8px; }

  main { min-width: 0; padding: 24px clamp(16px, 3vw, 40px) 64px; }
  /* title and details, then the buttons underneath (the same for every graphic, whatever the title's length) */
  .head { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
  .head h2 { font-size: clamp(20px, 2.4vw, 28px); font-weight: 800; margin: 0 0 4px; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta code { background: #f1efe9; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .actions, .widths { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .btn {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid #000;
    background: #fff; color: #000; text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--accent); }
  .widths button { border-color: #c9ced4; font-size: 12px; padding: 5px 10px; }
  .widths button.on { border-color: #000; background: #000; color: #fff; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .toolbar span { font-size: 12px; color: var(--muted); }

  .stage { background: #e9e6df; border-radius: 12px; padding: 16px; overflow-x: auto; }
  .frame { background: #fff; margin: 0 auto; box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: max-width .2s; }
  iframe { display: block; width: 100%; border: 0; height: 600px; }

  h3 { font-size: 16px; margin: 28px 0 8px; }
  pre {
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    overflow-x: auto; font-size: 12px; line-height: 1.5; margin: 0 0 8px;
  }
  .note { font-size: 13px; color: var(--muted); max-width: 75ch; line-height: 1.5; }

  /* ---------- narrow screens: the side panel becomes a dropdown ---------- */
  .picker { display: none; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    .picker { display: block; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .picker select { width: 100%; font: inherit; font-size: 15px; padding: 8px; border-radius: 8px; border: 1px solid #d0d3d6; }
    main { padding-top: 16px; }
  }
</style>
</head>
<body>
<div class="picker"><select id="picker" aria-label="Choose a graphic"></select></div>
<div class="app">
  <aside>
    <div class="brand">
      <h1>BFF data visuals</h1>
      <p id="count"></p>
    </div>
    <div class="search"><input id="search" type="search" placeholder="Search graphics…" aria-label="Search graphics"></div>
    <nav id="nav" aria-label="Graphics"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
  /* ------------------------------------------------------------------
   * THE LIST OF GRAPHICS, following the IDs in the tracking sheet.
   * A graphic with one version:
   *   { id: "C1", name: "…", section: "Coal core page", slug: "folder-name", tab: "Sheet tab", title: "…", height: 650 }
   * A graphic with several versions (shown as a pop-out menu in the side panel):
   *   { id: "G1", name: "…", section: "…", versions: [ { id: "G1.1", label: "…", slug, tab, title, height }, … ] }
   *   slug   = folder name (never rename once embedded)
   *   tab    = the Google Sheet tab(s) it reads
   *   height = starting iframe height in px (the embed code adjusts it)
   * ------------------------------------------------------------------ */
  var GRAPHICS = [
    { id: "C1", name: "Europe’s Coal exit country map", section: "Coal core page", slug: "coal-exit-map", tab: "C1",
      title: "Overview of country coal phase-out announcements and plans in Europe", height: 860 },
    { id: "C2", name: "Coal Power plant tracker map", section: "Coal core page", slug: "coal-plant-map", tab: "C2",
      title: "Coal power plants in Europe", height: 860 },
    { id: "C3", name: "Coal CO2 map", section: "Coal data tool page", slug: "coal-co2-map", tab: "C3",
      title: "CO2 emissions from coal power plants in Europe", height: 860 },
    { id: "C4", name: "CO2 coal share of GHG", section: "Coal data tool page", slug: "coal-co2-share", tab: "C4",
      title: "EU+UK: Relevance of CO2 from coal power relative to all GHG emissions", height: 780 },
    { id: "C5", name: "Coal capacity", section: "Coal data tool page", slug: "coal-capacity", tab: "C5",
      title: "Coal power capacity: development since 2016 and projections up to 2030", height: 920 },
    { id: "C6", name: "CO2 utilities", section: "Coal data tool page", slug: "coal-co2-utilities", tab: "C6",
      title: "CO2 emissions by utility from coal power stations in the EU+UK", height: 880 },
    { id: "C7", name: "New coal by region", section: "Coal data tool page", slug: "coal-new-projects", tab: "C7",
      title: "New coal power plant projects: almost there, but there’s still work to do", height: 680 },
    { id: "G1", name: "Gas tracker", section: "Gas core page", versions: [
      { id: "G1.1", label: "Capacity", slug: "gas-tracker-capacity", tab: "G1 (GW columns)",
        title: "Tracking the capacity of new gas projects", height: 650 },
      { id: "G1.2", label: "Units", slug: "gas-tracker", tab: "G1 (units columns)",
        title: "Tracking number of new gas unit projects", height: 650 },
      { id: "G1.3", label: "Both (units / capacity switch)", slug: "gas-tracker-switch", tab: "G1",
        title: "Tracking new gas projects", height: 720 }
    ]},
    { id: "G2", name: "The import trap comparison", section: "Gas core page", slug: "gas-import-map", tab: "G2",
      title: "Doubling down: current gas import reliance vs. planned capacity", height: 860 },
    { id: "G3", name: "Power plant map", section: "Gas data tool page", slug: "gas-plant-map", tab: "G3",
      title: "Europe’s existing and planned gas power plants", height: 860 },
    { id: "G4", name: "Overall gas tracking progress", section: "Gas data tool page", slug: "gas-tracking-progress", tab: "G4",
      title: "Overall gas tracking progress", height: 660 },
    { id: "G5", name: "Europe's existing fleet and new plant projects capacity (MW)", section: "Gas data tool page", slug: "gas-fleet-by-country", tab: "G5+G6",
      title: "Europe’s existing fleet and new plant projects capacity", height: 1300 },
    { id: "G6", name: "Europe's existing fleet and new plant projects capacity (%)", section: "Gas data tool page", slug: "gas-fleet-by-country-share", tab: "G5+G6",
      title: "Share of capacity by status in Europe’s existing fleet and new plant projects", height: 1300 },
    { id: "R1", name: "Europe power mix", section: "Renewables", slug: "power-mix", tab: "R1",
      title: "Share of total electricity generation by source, 2015 to 2025", height: 800 },
    { id: "R2", name: "Gas vs solar investment", section: "Renewables", versions: [
      { id: "R2.1", label: "Side by side (two columns)", slug: "gas-vs-solar-imports", tab: "R2",
        title: "Spending €100 billion on solar panel imports instead of gas imports could produce 9x more electricity", height: 640 },
      { id: "R2.2", label: "One above the other (two rows)", slug: "gas-vs-solar-imports", query: "?type=rows", tab: "R2",
        title: "Spending €100 billion on solar panel imports instead of gas imports could produce 9x more electricity", height: 640 }
    ]},
    { id: "F1", name: "The grid bottleneck", section: "Clean flex", slug: "grid-queue-value", tab: "F1",
      title: "Value of realistic buildable capacity in the queue", height: 860 },
    { id: "F2", name: "Growth outlook", section: "Clean flex", slug: "clean-flex-outlook", tab: "F2",
      title: "Outlook for European clean flexibility growth", height: 840 },
    { id: "F3", name: "Batteries and storage", section: "Clean flex", slug: "battery-storage", tab: "F3",
      title: "Top 5 European countries for installed and planned grid-scale battery capacity", height: 600 }
  ];

  // Every version as one flat list (a single-version graphic is its own version)
  var VERSIONS = [];
  GRAPHICS.forEach(function (g) {
    (g.versions || [g]).forEach(function (v) {
      v.graphic = g;
      v.fullLabel = g.versions ? g.name + " – " + v.label : g.name;
      // query: optional URL options for a version of the same page, e.g. "?type=bars"
      v.query = v.query || "";
      v.key = v.slug + (v.query ? v.query.replace(/^\?/, "~") : "");
      v.src = v.slug + "/" + v.query;
      VERSIONS.push(v);
    });
  });
  function bySlug(key) { return VERSIONS.filter(function (v) { return v.key === key; })[0]; }

  var base = location.href.replace(/[?#].*$/, "").replace(/index\.html$/, "");
  var nav = document.getElementById("nav"), main = document.getElementById("main");
  var picker = document.getElementById("picker"), search = document.getElementById("search");
  var width = "100%";

  // Embed: the iframe (data-track-height lets the website's shared listener resize it) plus a small script
  // that resizes only this iframe, so it also works on pages without that listener. Both use the same height.
  function embedCode(g) {
    var id = "dv-" + g.key.replace(/[^a-z0-9-]/gi, "-");
    return [
      '<iframe id="' + id + '" src="' + base + g.src + '" title="' + g.title + '"',
      '        data-track-height style="width:100%;border:0;height:' + g.height + 'px" scrolling="no" loading="lazy"></iframe>',
      "<script>",
      "  (function () {",
      '    var f = document.getElementById("' + id + '");',
      '    window.addEventListener("message", function (e) {',
      '      if (e.source === f.contentWindow && e.data && e.data.type === "dv-height") f.style.height = e.data.height + "px";',
      "    });",
      "  })();",
      "<\/script>"
    ].join("\n");
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  document.getElementById("count").textContent =
    GRAPHICS.length + " graphic" + (GRAPHICS.length === 1 ? "" : "s") +
    (VERSIONS.length > GRAPHICS.length ? " (" + VERSIONS.length + " versions)" : "") + " · live data from Google Sheets";

  /* ---------- side panel ---------- */
  function versionLink(v, showName) {
    return '<a href="#' + esc(v.key) + '" data-slug="' + esc(v.key) + '"><b class="vid">' + esc(v.id) + "</b> " +
      esc(showName ? v.fullLabel : v.label) + "</a>";
  }
  function buildNav(filter) {
    var q = (filter || "").trim().toLowerCase();
    var html = "", lastSection = null;
    function section(name) {
      if (name !== lastSection) { html += '<div class="group">' + esc(name) + "</div>"; lastSection = name; }
    }
    if (q) {
      // While searching, list matching versions directly
      VERSIONS.filter(function (v) {
        return (v.id + " " + v.fullLabel + " " + v.title + " " + v.tab + " " + v.slug + " " + v.graphic.section).toLowerCase().indexOf(q) > -1;
      }).forEach(function (v) { section(v.graphic.section || "Other"); html += versionLink(v, true); });
    } else {
      GRAPHICS.forEach(function (g) {
        section(g.section || "Other");
        if (!g.versions) { html += versionLink(g, true); return; }
        html += '<div class="navitem" data-graphic="' + esc(g.id) + '">' +
          '<button type="button" class="parent" aria-haspopup="true" aria-expanded="false">' +
            '<span><b class="vid">' + esc(g.id) + "</b> " + esc(g.name) + '<small class="sub">' + g.versions.length + " versions</small></span>" +
            '<span class="chev" aria-hidden="true">›</span></button>' +
          '<div class="flyout" role="menu" aria-label="' + esc(g.id + " " + g.name) + ' versions">' +
            '<div class="fly-head">' + esc(g.id) + " · " + esc(g.name) + "</div>" +
            g.versions.map(function (v) { return versionLink(v, false); }).join("") +
          "</div></div>";
      });
    }
    nav.innerHTML = html || '<div class="empty">No graphics match “' + esc(filter) + "”.</div>";
    wireFlyouts();
    markActive();
  }

  // Pop-out menus: open on hover or keyboard focus (desktop), or on click (touch screens)
  var openItem = null, closeTimer = null;
  function openFly(item) {
    clearTimeout(closeTimer);
    if (openItem && openItem !== item) closeFly(openItem);
    var fly = item.querySelector(".flyout"), btn = item.querySelector(".parent");
    var r = btn.getBoundingClientRect(), side = document.querySelector("aside").getBoundingClientRect();
    fly.classList.add("open");
    fly.style.left = side.right + 6 + "px";
    fly.style.top = Math.max(8, Math.min(r.top - 6, window.innerHeight - fly.offsetHeight - 8)) + "px";
    btn.setAttribute("aria-expanded", "true");
    openItem = item;
  }
  function closeFly(item) {
    item.querySelector(".flyout").classList.remove("open");
    item.querySelector(".parent").setAttribute("aria-expanded", "false");
    if (openItem === item) openItem = null;
  }
  function wireFlyouts() {
    Array.prototype.forEach.call(nav.querySelectorAll(".navitem"), function (item) {
      var btn = item.querySelector(".parent");
      item.addEventListener("mouseenter", function () { openFly(item); });
      item.addEventListener("mouseleave", function () { closeTimer = setTimeout(function () { closeFly(item); }, 200); });
      item.addEventListener("focusin", function () { openFly(item); });
      item.addEventListener("focusout", function (e) { if (!item.contains(e.relatedTarget)) closeFly(item); });
      btn.addEventListener("click", function () { if (openItem === item) closeFly(item); else openFly(item); });
      Array.prototype.forEach.call(item.querySelectorAll(".flyout a"), function (a) {
        a.addEventListener("click", function () { closeFly(item); });
      });
    });
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openItem) closeFly(openItem); });
  document.addEventListener("click", function (e) { if (openItem && !openItem.contains(e.target)) closeFly(openItem); });
  document.querySelector("aside").addEventListener("scroll", function () { if (openItem) closeFly(openItem); });

  /* ---------- dropdown (narrow screens) ---------- */
  function buildPicker() {
    var html = "", lastSection = null;
    VERSIONS.forEach(function (v) {
      var sec = v.graphic.section || "Other";
      if (sec !== lastSection) { if (lastSection !== null) html += "</optgroup>"; html += '<optgroup label="' + esc(sec) + '">'; lastSection = sec; }
      html += '<option value="' + esc(v.key) + '">' + esc(v.id + " · " + v.fullLabel) + "</option>";
    });
    html += "</optgroup>";
    picker.innerHTML = html;
    picker.addEventListener("change", function () { location.hash = picker.value; });
  }
  function markActive() {
    var cur = current(), v = bySlug(cur);
    Array.prototype.forEach.call(document.querySelectorAll("aside a[data-slug]"), function (a) {
      a.classList.toggle("active", a.getAttribute("data-slug") === cur);
    });
    // A graphic with versions is highlighted when one of its versions is shown, and says which one
    Array.prototype.forEach.call(nav.querySelectorAll(".navitem"), function (item) {
      var g = GRAPHICS.filter(function (x) { return x.id === item.getAttribute("data-graphic"); })[0];
      var on = !!(v && v.graphic === g);
      item.querySelector(".parent").classList.toggle("active", on);
      item.querySelector(".sub").textContent = on ? "Showing " + v.id + " · " + v.label : g.versions.length + " versions";
    });
    picker.value = cur;
  }
  function current() {
    var h = decodeURIComponent(location.hash.slice(1));
    return bySlug(h) ? h : VERSIONS[0].key;
  }

  /* ---------- main area ---------- */
  function show() {
    var key = current();
    markActive();
    var g = bySlug(key), parent = g.graphic;
    document.title = g.id + " " + g.fullLabel + " · BFF data visuals";
    main.innerHTML =
      '<div class="head"><div><h2>' + esc(g.title) + "</h2>" +
        '<div class="meta"><b>' + esc(g.id) + "</b> · " + esc(g.fullLabel) + " · Sheet tab <code>" + esc(g.tab) + "</code> · Folder <code>" + esc(g.slug) + "/</code></div>" +
        (parent.versions ? '<div class="versions">' + parent.versions.map(function (v) {
          return '<a href="#' + esc(v.key) + '" class="' + (v === g ? "on" : "") + '"><b>' + esc(v.id) + "</b> " + esc(v.label) + "</a>";
        }).join("") + "</div>" : "") +
        "</div>" +
        '<div class="actions">' +
          '<button class="primary" id="copy-embed">Copy embed code</button>' +
          '<a class="btn" href="' + esc(g.src) + '" target="_blank" rel="noopener">Open</a>' +
          '<a class="btn" href="' + esc(g.slug) + "/" + (g.query ? esc(g.query) + "&amp;design" : "?design") + '" target="_blank" rel="noopener">Design mode</a>' +
        "</div></div>" +
      '<div class="toolbar"><span>Preview width</span><div class="widths">' +
        '<button data-w="100%">Full</button><button data-w="768px">Tablet</button><button data-w="375px">Phone</button>' +
      "</div></div>" +
      '<div class="stage"><div class="frame" id="frame"><iframe src="' + esc(g.src) + '" scrolling="no" title="' + esc(g.title) + '"></iframe></div></div>' +
      "<h3>Embed code</h3>" +
      '<pre id="embed"></pre>' +
      '<p class="note">Paste this into a <b>Custom HTML</b> block in WordPress. It includes a small script that resizes the graphic to fit, so nothing else is needed on the site.</p>';
    document.getElementById("embed").textContent = embedCode(g);
    document.getElementById("copy-embed").addEventListener("click", function (ev) { copy(embedCode(g), ev.target); });
    Array.prototype.forEach.call(main.querySelectorAll("[data-w]"), function (b) {
      b.addEventListener("click", function () { width = b.getAttribute("data-w"); applyWidth(); });
    });
    applyWidth();
    main.scrollTop = 0; window.scrollTo(0, 0);
  }
  function applyWidth() {
    var f = document.getElementById("frame");
    if (f) f.style.maxWidth = width;
    Array.prototype.forEach.call(main.querySelectorAll("[data-w]"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-w") === width);
    });
  }
  function copy(text, btn) {
    var done = function () {
      var old = btn.textContent; btn.textContent = "Copied ✓";
      setTimeout(function () { btn.textContent = old; }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done);
    else {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove(); done();
    }
  }

  // The same auto-height script the website uses, so previews here fit too
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "dv-height") return;
    document.querySelectorAll("iframe").forEach(function (f) {
      if (f.contentWindow === e.source) f.style.height = e.data.height + "px";
    });
  });

  search.addEventListener("input", function () { buildNav(search.value); });
  window.addEventListener("hashchange", show);
  buildNav("");
  buildPicker();
  show();
</script>
</body>
</html>
