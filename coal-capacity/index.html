      lc.firstChild.classList.add("dvc-left");

      var host = document.getElementById("slider-host"); DV.clear(host);
      slider = DV.timeSlider({ dates: vintages.map(function (v) { return { label: String(v), t: +v }; }), index: current,
        onChange: function (i) { current = i; ctx.rerender(); } });
      slider.setStyle(S);
      host.appendChild(slider);

      var box = document.getElementById("countries"); DV.clear(box);
      box.style.setProperty("--cc-cols", S.countryCols);
      countries = countries.map(function (c) {
        var d = document.createElement("div"); d.className = "dvc-panel";
        var h = document.createElement("h3"); h.textContent = c; d.appendChild(h);
        var svg = DV.el("svg", {}, d);
        box.appendChild(d);
        return { name: c, svg: svg };
      });
    },

    render: function (ctx) {
      var S = ctx.S, un = S.unitLabel;
      DV.chartSizes(ctx);
      var grid = document.getElementById("grid");
      grid.style.setProperty("--dvc-gap-x", S.chartGap + "px");
      // side by side, both halves start their charts at the same height (legends padded to the taller one)
      var lgs = [document.getElementById("legend-main"), document.getElementById("legend-countries")];
      lgs.forEach(function (l) { l.style.minHeight = ""; });
      if (!ctx.stacked) { var lh = Math.max(lgs[0].offsetHeight, lgs[1].offsetHeight); lgs.forEach(function (l) { l.style.minHeight = lh + "px"; }); }
      var v = vintages[current];
      var all = ctx.data.filter(function (d) { return +d.Year <= S.lastYear; });
      var rows = all.filter(function (d) { return d[VY] === v; }).map(function (d) {
        var hist = +d.Year <= +v, r = { Year: d.Year, hist: hist, src: d };
        r.hh = hist ? d[HARD] : 0; r.lh = hist ? d[LIG] : 0; r.hp = hist ? 0 : d[HARD]; r.lp = hist ? 0 : d[LIG];
        return r;
      });
      var fmt = function (x) { return DV.fmt(x, un, 1); };
      var scaleRows = S.fixedScale ? all : rows.map(function (r) { return r.src; });
      var ax = DV.niceAxis(Math.max.apply(null, scaleRows.map(function (d) { return d[HARD] + d[LIG]; })), 5);
      var w = document.getElementById("p-main").clientWidth;
      var h = DV.clamp(w * S.chartHeight, 240, 640);
      var tipMain = function (i) {
        var r = rows[i], d = r.src, tag = r.hist ? S.lHist : S.lProj;
        return "<b>" + d.Year + " (" + tag.toLowerCase() + ")</b>" +
          DV.tipRow(r.hist ? S.hardCoalHistoric : S.hardCoalProjected, HARD, fmt(d[HARD])) +
          DV.tipRow(r.hist ? S.ligniteHistoric : S.ligniteProjected, LIG, fmt(d[LIG])) +
          DV.tipRow("", "Total", fmt(d[HARD] + d[LIG]), "t");
      };
      DV.bars({ S: S, svg: document.getElementById("s-main"), tip: document.getElementById("t-main"), width: w, height: h, rows: rows,
        label: function (d) { return d.Year; }, gap: S.barGap, sep: S.pageBg === "transparent" ? "#fff" : S.pageBg,
        series: [{ key: "hh", color: S.hardCoalHistoric }, { key: "hp", color: S.hardCoalProjected },
          { key: "lh", color: S.ligniteHistoric }, { key: "lp", color: S.ligniteProjected }],
        yMax: ax.max, tickStep: ax.step, fmtY: function (x) { return DV.fmt(x, un, 0); }, tooltip: tipMain });

      var cbox = document.getElementById("countries");
      cbox.style.setProperty("--cc-cols", cbox.clientWidth < 360 ? Math.min(2, S.countryCols) : S.countryCols);
      var tip = document.getElementById("t-countries");
      countries.forEach(function (c) {
        var cw = c.svg.parentNode.clientWidth, n = c.name;
        var cr = rows.map(function (r) { return { Year: r.Year, h: r.hist ? r.src[n] : 0, p: r.hist ? 0 : r.src[n], v: r.src[n], hist: r.hist }; });
        var src = S.fixedScale ? all : rows.map(function (r) { return r.src; });
        var a = DV.niceAxis(Math.max.apply(null, src.map(function (d) { return d[n]; })) || 1, 2);
        var last = cr.length - 1, mid = Math.round(last / 2);
        DV.bars({ S: S, svg: c.svg, tip: tip, width: cw, height: S.smallHeight, rows: cr, top: 4,
          label: function (d) { return d.Year; }, xLabelAt: function (i) { return i === 0 || i === last || (i === mid && cw > 150); },
          gap: 0.18, series: [{ key: "h", color: S.capacityHistoric }, { key: "p", color: S.capacityProjected }],
          yMax: a.max, tickStep: a.step, fmtY: function (x) { return DV.fmt(x, un, 0); },
          tooltip: function (i) {
            var d = cr[i];
            return "<b>" + n + ", " + d.Year + "</b>" + DV.tipRow(d.hist ? S.capacityHistoric : S.capacityProjected, d.hist ? S.lHist : S.lProj, fmt(d.v));
          } });
      });
    }
  });
})();
</script>
</body>
</html>
