  var SHEET_ID = "1pn2TOwSXL6ujuXxcuK5J7IdvVU25q-9BxPi6apM500w";

  ].join("\n");

  // The two capacity statuses: column, colour in the brand palette ("Gas plant status")
  var STATUSES = [
    { code: "operating",   column: "Operating (GW)",      color: "gasOperating" },
    { code: "development", column: "In development (GW)", color: "gasInDevelopment" }
  ];
  var SYMBOLS = ["pie chart", "two circles side by side", "nested circles", "operating only", "in development only"];
  var POSITIONS = ["label point (as in the R map)", "sheet coordinates (Lat, Lon)"];

  var state = { rows: [], byId: {}, active: null, selected: null, topo: null, geometry: null, labelPts: {} };
  var ui = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(n) ? n : null; }
  function fill(text, vars) { return String(text || "").replace(/\{(\w+)\}/g, function (m, k) { return k in vars ? vars[k] : m; }); }
  function pairs(text) {
    var out = {};
    String(text || "").split(/\n/).forEach(function (line) {
      var m = /^\s*([\w-]+)\s*::\s*(.*?)\s*$/.exec(line);
      if (m) out[m[1]] = m[2];
    });
    return out;
  }

  function prepare(ctx) {
    state.byId = {};
    state.rows = ctx.data.map(function (d) {
      var r = { id: DV.isoCode(d.ISO), name: d.Country || d.ISO, imports: num(d["Gas imports (TWh)"]),
        lat: num(d.Lat), lon: num(d.Lon), cap: {} };
      STATUSES.forEach(function (st) { r.cap[st.code] = num(d[st.column]); });
      state.byId[r.id] = r;
      return r;
    });
  }

  // Gas imports -> colour (linear or square-root scale from 0 to the largest value)
  function importsMax(S) {
    return +S.importsMax > 0 ? +S.importsMax : Math.max.apply(null, state.rows.map(function (r) { return r.imports || 0; }));
  }
  function importsColor(S) {
    var ramp = DV.colorRamp([S.importsLow, S.importsHigh]), max = importsMax(S) || 1;
    return function (v) {
      var t = DV.clamp(v / max, 0, 1);
      return ramp(S.importsScale === "square root" ? Math.sqrt(t) : t);
    };
  }
  function style(S) {
    var col = importsColor(S);
    return function (f) {
      var r = state.byId[f.id];
      if (!r) return null;                                   // not in the data: see "Countries without data"
      if (r.imports == null) return { fill: S.noDataFill, on: true };
      return { fill: col(r.imports), on: true };
    };
  }

  function statusLabel(S, code) { return pairs(S.statusLabels)[code] || code; }
  function shown(code) { return !state.active || state.active[code]; }

  // Popup / panel: the same three numbers for a country and for its symbol
  function info(S, r) {
    var L = pairs(S.popupLabels), na = '<span class="na">' + esc(L.noData || "no data") + "</span>";
    var h = '<div class="g2-head">' + (S.flagShow ? '<img src="' + DV.sharedUrl + "flags/" + esc(r.id) + '.svg" alt="" onerror="this.remove()">' : "") +
      "<b>" + esc(r.name) + "</b></div><table class=\"g2-rows\">";
    var swatch = r.imports == null ? S.noDataFill : importsColor(S)(r.imports);
    h += '<tr><td><i class="sq" style="background:' + swatch + '"></i>' + esc(L.imports || "") + "</td><td>" +
      (r.imports == null ? na : esc(DV.fmt(r.imports, S.importsUnit, 1))) + "</td></tr>";
    STATUSES.forEach(function (st) {
      var v = r.cap[st.code];
      if (st.code === "development" && !(v > 0)) return;   // no capacity in development: no row
      h += '<tr><td><i style="background:' + S[st.color] + '"></i>' + esc(L[st.code] || "") + "</td><td>" +
        (v == null ? na : esc(DV.fmt(v, S.capacityUnit, 2))) + "</td></tr>";
    });
    return h + "</table>";
  }

  // The symbols for each country, for the chosen style
  function symbols(S, w) {
    var mode = S.symbolMode, list = [];
    function pos(r) {
      if (S.pointPosition === POSITIONS[1] && r.lat != null && r.lon != null) return [r.lon, r.lat];
      return state.labelPts[r.id] || (r.lat != null ? [r.lon, r.lat] : null);
    }
    function val(r, code) { return shown(code) && r.cap[code] > 0 ? r.cap[code] : 0; }
    var codes = mode === "operating only" ? ["operating"] : mode === "in development only" ? ["development"] : ["operating", "development"];
    var max = 0;
    state.rows.forEach(function (r) {
      if (mode === "pie chart") max = Math.max(max, codes.reduce(function (t, c) { return t + val(r, c); }, 0));
      else codes.forEach(function (c) { max = Math.max(max, val(r, c)); });
    });
    var radius = DV.bubbleRadius(S, max, w);
    state.rows.forEach(function (r) {
      var p = pos(r);
      if (!p) return;
      var base = { lon: p[0], lat: p[1], opacity: S.bubbleOpacity, stroke: S.bubbleStroke, strokeWidth: S.bubbleStrokeWidth };
      if (mode === "pie chart") {
        var total = codes.reduce(function (t, c) { return t + val(r, c); }, 0);
        if (total > 0) list.push(Object.assign({ id: r.id, r: radius(total),
          slices: codes.map(function (c) { return { value: val(r, c), fill: S[STATUSES.filter(function (st) { return st.code === c; })[0].color] }; }) }, base));
        return;
      }
      var items = codes.map(function (c) {
        return { code: c, v: val(r, c), color: S[STATUSES.filter(function (st) { return st.code === c; })[0].color] };
      }).filter(function (it) { return it.v > 0; });
      items.forEach(function (it, i) {
        var b = Object.assign({ id: r.id + "|" + it.code, r: radius(it.v), fill: it.color }, base);
        // side by side: operating on the left, in development on the right, touching at the point
        if (mode === "two circles side by side" && items.length === 2) b.dx = (i === 0 ? -1 : 1) * (b.r + S.symbolGap / 2);
        list.push(b);
      });
    });
    return { list: list, radius: radius, max: max };
  }

  function select(ctx, id, touch) {
    var S = ctx.S, r = state.byId[id];
    state.selected = r ? id : null;
    ui.view.select(state.selected, "country");
    ui.search.set(state.selected);
    var wasOpen = ui.panelOpen;
    ui.panelOpen = !!r && (touch || ctx.stacked);
    if (ui.panelOpen) ui.panelBody.innerHTML = info(S, r);
    if (ui.panelOpen || wasOpen) ctx.rerender();
    if (r && !ui.panelOpen && S.tooltipShow) {
      var b = ui.view.bubbleAt(id) || ui.view.bubbleAt(id + "|operating") || ui.view.bubbleAt(id + "|development");
      if (b) ui.view.tipAt(b.getAttribute("data-id"), info(S, r));
    }
  }

  function makeUI(ctx) {
    var layout = DV.mapLayout(document.getElementById("map"), ctx.root);
    var view = DV.mapView(layout.stage);
    var panel = document.createElement("div"); panel.className = "dvm-panel dv-control";
    var close = document.createElement("button"); close.className = "dvm-panel-close"; close.type = "button";
    close.setAttribute("aria-label", "Close"); close.innerHTML = "&times;";
    var body = document.createElement("div");
    panel.appendChild(close); panel.appendChild(body);
    ui = { layout: layout, view: view, panel: panel, panelBody: body, panelOpen: false };
    close.addEventListener("click", function () { select(ctx, null); });

    // a country and its symbol(s) show the same popup
    function countryOf(id) { return String(id || "").split("|")[0]; }
    view.onHover = function (id) {
      var r = state.byId[countryOf(id)];
      return r && ctx.S.tooltipShow ? info(ctx.S, r) : "";
    };
    view.onClick = function (id) {
      var iso = countryOf(id), touch = view.lastPointer === "touch" || view.lastPointer === "pen";
      select(ctx, iso && iso !== state.selected ? iso : null, touch);
    };
    ui.search = DV.mapSearch({
      items: state.rows.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .map(function (r) { return { id: r.id, label: r.name }; }),
      onSelect: function (id) { select(ctx, id); }
    });
  }

  DV.create({
    sheetId: SHEET_ID,
    sheetTab: SHEET_TAB,
    fallback: FALLBACK,
    columns: ["ISO", "Country", "Gas imports (TWh)", "Operating (GW)", "In development (GW)"],
    text: true,

    groups: [
      { name: "Text", fields: [
        { key: "title",        type: "text", def: "Doubling down: current gas import reliance vs. planned capacity", help: "Main title (empty = none)" },
        { key: "footer",       type: "text", def: "Sources: [BFF gas power plant database](https://beyondfossilfuels.org/gas/) (July 2026); 2024 energy balances from [Eurostat](https://ec.europa.eu/eurostat/databrowser/view/nrg_bal_c/default/table?lang=en) and, for the UK, [DUKES](https://www.gov.uk/government/statistics/natural-gas-chapter-4-digest-of-united-kingdom-energy-statistics-dukes). Note: plants in development include those at announced, pre-construction, construction and shelved statuses; gas imports are each country's total natural gas imports in 2024.", help: "Footer; [text](https://…) makes a link. Leave empty to hide" },
        { key: "notes",        type: "textarea", rows: 4, def: "", help: "Notes under the footer, one paragraph per line; [text](https://…) makes a link" },
        { key: "importsTitle", type: "text", def: "Gas imports (TWh)", help: "Title of the gas imports colour legend" },
        { key: "statusTitle",  type: "text", def: "Gas power capacity", help: "Title of the operating / in development legend (empty = none)" },
        { key: "statusLabels", type: "textarea", rows: 2, def: "operating :: Operating\ndevelopment :: In development", help: "Legend wording, one line per status: code :: wording" },
        { key: "popupLabels",  type: "textarea", rows: 4, def: "imports :: Gas imports (2024)\noperating :: Operating capacity\ndevelopment :: In development\nnoData :: no data", help: "Popup wording, one line per row: key :: wording" },
        { key: "importsUnit",  type: "text", def: "TWh", help: "Unit after gas imports in the popup" },
        { key: "capacityUnit", type: "text", def: "GW", help: "Unit after capacities in the popup" },
        { key: "searchPlaceholder", type: "text", def: "Select country", help: "Search box placeholder" }
      ]},
      { name: "Symbols", fields: [
        { key: "symbolMode",    type: "select", options: SYMBOLS, def: "pie chart", help: "Capacity symbols, pie chart: one pie per country sized by total capacity; side by side or nested: one circle per status" },
        { key: "pointPosition", type: "select", options: POSITIONS, def: POSITIONS[0], help: "Where the symbols sit, label point: inside each country's main territory (Natural Earth, as in the R map); sheet coordinates: the Lat and Lon columns (capitals, as in Flourish)" },
        { key: "symbolGap",     type: "range", min: 0, max: 10, step: 0.5, def: 1, help: "Space between the two circles side by side, in px" },
        { key: "statusLegendPos", type: "select", options: DV.POSITIONS, def: "above map", help: "Operating / in development legend position" },
        { key: "legendDir",     type: "select", options: ["vertical", "horizontal"], def: "horizontal", help: "Operating / in development legend direction" },
        { key: "legendGap",     type: "range", min: 0, max: 40, step: 1, def: 14, help: "Space between legend items in px" },
        { key: "legendFilter",  type: "check", def: true, help: "Click a legend item to show only that status (like Flourish's switch)" }
      ]},
      { name: "Gas imports colours", fields: [
        { key: "importsLow",       type: "color", def: "#f1e9e4", help: "Colour for no gas imports (the scale starts at 0)" },
        { key: "importsHigh",      type: "color", def: "#6D330C", help: "Colour for the largest gas imports (the brand's gas colour)" },
        { key: "importsScale",     type: "select", options: ["linear", "square root"], def: "linear", help: "Colour scale, linear: as in the R map; square root: more contrast between smaller importers" },
        { key: "importsMax",       type: "range", min: 0, max: 1500, step: 10, def: 0, help: "Value that gets the darkest colour (0 = the largest in the data)" },
        { key: "importsLegendPos", type: "select", options: DV.POSITIONS, def: "above map", help: "Gas imports legend position" },
        { key: "importsLegendWidth", type: "range", min: 80, max: 400, step: 5, def: 180, help: "Gas imports legend width in px" }
      ]},
      { name: "Popup and search", fields: [
        { key: "tooltipShow",  type: "check", def: true, help: "Show a popup when hovering over a country or its symbol (mouse only)" },
        { key: "tooltipWidth", type: "range", min: 180, max: 480, step: 5, def: 300, help: "Popup maximum width in px" },
        { key: "flagShow",     type: "check", def: true, help: "Show the country's flag in the popup" },
        { key: "searchPos",    type: "select", options: DV.POSITIONS, def: "above map", help: "Country search position" },
        { key: "searchWidth",  type: "range", min: 80, max: 400, step: 5, def: 160, help: "Search box width in px" }
      ]}
    ].concat(DV.bubbleGroup({
      bubbleMinR: 8, bubbleMaxR: 32, sizeLegendPos: "above map", sizeLegendTitle: "Capacity (GW)", sizeLegendValues: "1, 20"
    }), DV.mapGroups({
      noDataShow: "BFF countries only", noDataFill: "#e0e0e0", borderWidth: 0.8, smallMode: "as they are",
      viewWest: -12, viewEast: 45, viewSouth: 33.5, viewNorth: 69.3
    })),

    build: function (ctx) {
      var S = ctx.S;
      prepare(ctx);
      if (!ui) makeUI(ctx);
      var st = ctx.root.style;
      st.setProperty("--dvm-search-width", S.searchWidth + "px");
      st.setProperty("--dvm-tip-width", S.tooltipWidth + "px");
      st.setProperty("--dvm-panel-size", S.tooltipSize + "px");
      document.getElementById("dv-title").style.display = S.title ? "" : "none";
      document.getElementById("notes").innerHTML = String(S.notes || "").split(/\n/).filter(function (l) { return l.trim(); })
        .map(function (l) { return "<p>" + DV.linkify(l) + "</p>"; }).join("");

      if (ui.statusLegend) ui.statusLegend.remove();
      state.active = null;
      var codes = S.symbolMode === "operating only" ? ["operating"] : S.symbolMode === "in development only" ? ["development"] : ["operating", "development"];
      ui.statusLegend = DV.mapLegend({
        title: S.statusTitle,
        items: STATUSES.filter(function (s) { return codes.indexOf(s.code) > -1; })
          .map(function (s) { return { key: s.code, label: statusLabel(S, s.code), color: S[s.color] }; }),
        onToggle: S.legendFilter && codes.length > 1 ? function (active) { state.active = active; ctx.rerender(); } : null
      });
      ui.statusLegend.setLayout(S.legendDir, S.legendGap);

      if (ui.importsLegend) ui.importsLegend.remove();
      ui.importsLegend = DV.gradientLegend({ title: S.importsTitle, min: 0, max: Math.round(importsMax(S)),
        colors: [0, 0.25, 0.5, 0.75, 1].map(function (t) { return importsColor(S)(t * importsMax(S)); }),
        fmt: function (v) { return DV.fmt(v, "", 0); } });
      Array.prototype.forEach.call(ui.importsLegend.querySelectorAll(".dvm-bar, .dvm-bar-labels"), function (e) { e.style.width = S.importsLegendWidth + "px"; });
      ui.search.setPlaceholder(S.searchPlaceholder);
      if (ui.panelOpen) ui.panelBody.innerHTML = info(S, state.byId[state.selected]);

      if (state.geometry !== S.geometry) {
        state.geometry = S.geometry;
        DV.loadGeo(S.geometry).then(function (topo) {
          if (state.geometry !== S.geometry) return;
          state.topo = topo;
          state.labelPts = {};
          topo.objects.countries.geometries.forEach(function (g) {
            if (g.properties && g.properties.lx != null) state.labelPts[g.id] = [g.properties.lx, g.properties.ly];
          });
          ctx.rerender();
        }, function (e) { console.warn("G2: map shapes could not be loaded (" + e.message + ")"); });
      }
    },

    render: function (ctx) {
      var S = ctx.S, narrow = ctx.stacked;
      var w0 = ui.layout.stage.clientWidth || ctx.W;
      if (ui.sizeLegend) { ui.sizeLegend.remove(); ui.sizeLegend = null; }
      var sym0 = symbols(S, w0);
      var values = String(S.sizeLegendValues || "").split(/[,;\s]+/).map(Number).filter(function (v) { return v > 0; });
      if (S.sizeLegendPos !== "hidden" && values.length) {
        ui.sizeLegend = DV.bubbleLegend({ title: S.sizeLegendTitle, values: values, r: sym0.radius,
          fmt: function (v) { return DV.fmt(v, S.capacityUnit, 0); } });
      }
      var list = [[ui.importsLegend, S.importsLegendPos], [ui.statusLegend, S.statusLegendPos]];
      if (ui.sizeLegend) list.push([ui.sizeLegend, S.sizeLegendPos]);
      list.push([ui.search, S.searchPos], [ui.panel, ui.panelOpen ? "below map" : "hidden", true]);
      ui.layout.place(list, narrow);
      if (!state.topo) return;

      var w = ui.layout.stage.clientWidth;
      var h = Math.round(w * (narrow ? S.mapHeightPhone : S.mapHeight));
      var view = Object.create(S);
      if (narrow) view.mapZoom = S.mapZoom * S.mapZoomPhone;
      ui.view.draw({
        S: S, width: w, height: h,
        projection: DV.mapProjection(view, w, h),
        features: DV.mapShapes(state.topo, S),
        style: style(S),
        label: (S.title || "Gas import map") + ": countries coloured by gas imports, with gas power capacity operating and in development"
      });
      ui.view.bubbles(symbols(S, w).list);
    }
  });
})();
</script>
</body>
</html>
