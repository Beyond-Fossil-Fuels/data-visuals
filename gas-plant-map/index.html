<style>
  /* Plant details (hover popup, and below the map on phones), as in the Flourish popup:
     a coloured header block, then a white table with thin lines between the rows; no frame around them */
  .c2-card.dvm-tip, .c2-card.dvm-panel { background: transparent; border: 0; box-shadow: none; padding: 0; }
  .c2-card .dvm-panel-close { top: 0.3em; right: 8px; color: inherit; }
  /* more padding above than below: the letters' box keeps room under the baseline for descenders (g, p, y),
     so this puts the visible capitals in the middle of the coloured block (measured in Inter) */
  .c2-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 0.8em 0.75em 0.5em;
    border-radius: 4px; line-height: 1; }
  .c2-head b { font-size: 1.2em; }
  .c2-head span { font-size: 1.05em; }
  .dvm-panel .c2-head { padding-right: 2.6em; }
  .c2-head.plain { padding: 0.45em 0.75em; background: #fff; border: 2px solid #e3e3e3; border-bottom: 0; border-radius: 4px 4px 0 0; }
  .c2-head.plain b { display: flex; align-items: center; gap: 8px; }
  .c2-head.plain i { width: 0.8em; height: 0.8em; border-radius: 50%; flex: none; }
  .c2-head.plain + .c2-body { margin-top: 0; border-radius: 0 0 4px 4px; }
  .c2-body { margin-top: 3px; padding: 0.3em 0.55em; border: 2px solid #e3e3e3; border-radius: 4px; background: #fff; }
  .c2-body table { width: 100%; border-collapse: collapse; }
  .c2-body td { padding: 0.28em 0.4em; vertical-align: top; border-bottom: 1px solid var(--c2-line, #e6e6e6); }
  .c2-body tr:last-child td { border-bottom: 0; }
  .c2-body td:first-child { white-space: nowrap; }
  .c2-body td + td { font-variant-numeric: tabular-nums; width: 100%; }
  .c2-body tr.sec td { font-weight: 700; }
  /* Notes under the footer */
  .c2-notes { margin: 6px 0 0; font-size: var(--c2-notes-size); }
  .c2-notes p { margin: 0 0 4px; }
  .c2-notes:empty { display: none; }
</style>

  // Status code -> colour in the brand palette ("Gas plant status").
  // The legend order and wording come from the "statusLabels" setting.
  var STATUS_COLORS = {
    "operating": "gasOperating",
    "mothballed": "gasMothballed",
    "announced": "gasAnnounced",
    "pre-construction": "gasPreConstruction",
    "construction": "gasConstruction",
    "shelved": "gasShelved",
    "cancelled": "gasCancelled",
    "retired": "gasRetired"
  };
  // Popup rows: [label key, column, section]
  var ROWS = [
    ["general", null, true],
    ["status", "status"],
    ["owner", "Owners"],
    ["chp", "CHP"],
    ["firstUnit", "First unit start"],
    ["retiredIn", "Retired in"],
    ["plannedRetirement", "Planned retirement"],
    ["capacity", null, true],
    ["operating", "Operating (MW)", false, true],
    ["mothballed", "Mothballed (MW)", false, true],
    ["announced", "Announced (MW)", false, true],
    ["preConstruction", "Pre-construction (MW)", false, true],
    ["construction", "Construction (MW)", false, true],
    ["shelved", "Shelved (MW)", false, true],
    ["cancelled", "Cancelled (MW)", false, true],
    ["retired", "Retired (MW)", false, true]
  ];

  var state = { plants: [], byId: {}, cats: [], active: null, selected: null, topo: null, geometry: null };
  var ui = null;

  function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(n) ? n : null; }
  // "key :: text" lines -> { key: text } (and the list of keys in order)
  function pairs(text) {
    var out = { keys: [] };
    String(text || "").split(/\n/).forEach(function (line) {
      var m = /^\s*(?:status\s+)?([\w-]+)\s*::\s*(.*?)\s*$/i.exec(line);
      if (m) { out[m[1]] = m[2]; out.keys.push(m[1]); }
    });
    return out;
  }
  function categories(S) {
    var p = pairs(S.statusLabels);
    return p.keys.filter(function (k) {
      if (!STATUS_COLORS[k]) console.warn("G3: unknown status code '" + k + "' in the legend wording setting");
      return STATUS_COLORS[k];
    }).map(function (k) { return { code: k, label: p[k], color: S[STATUS_COLORS[k]] }; });
  }
  function category(v) {
    var n = norm(v);
    return state.cats.filter(function (c) { return norm(c.code) === n || norm(c.label) === n; })[0] || null;
  }
  // black or white text, whichever reads better on a colour
  function textOn(hex) {
    var h = String(hex).replace("#", ""), c = [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16) / 255; });
    var l = c.map(function (v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2] > 0.4 ? "#000000" : "#ffffff";
  }

  function prepare(ctx) {
    state.cats = categories(ctx.S);
    state.byId = {};
    state.plants = ctx.data.map(function (d, i) {
      var p = { id: "p" + i, name: d.Name, country: d.Country || d.ISO, iso: DV.isoCode(d.ISO), lat: num(d.Lat), lon: num(d.Lon),
        cap: num(d["Capacity (MW)"]), cat: category(d.Status), row: d };
      if (!p.cat) console.warn("G3: unknown status '" + d.Status + "' for " + d.Name);
      if (p.lat == null || p.lon == null) console.warn("G3: no coordinates for " + d.Name);
      state.byId[p.id] = p;
      return p;
    }).filter(function (p) { return p.cat && p.lat != null && p.lon != null; });
  }

  // Popup / panel content (Flourish-like: coloured header, then a table)
  function info(S, p) {
    var L = pairs(S.popupLabels), c = p.cat, h;
    if (S.popupHeader === "coloured block") {
      var fg = S.popupHeaderText === "white" ? "#ffffff" : S.popupHeaderText === "black" ? "#000000" : textOn(c.color);
      h = '<div class="c2-head" style="background:' + c.color + ";color:" + fg + '"><b>' + esc(p.name) + "</b><span>" + esc(p.country) + "</span></div>";
      if (ui) ui.panel.style.color = fg;
    } else {
      if (ui) ui.panel.style.color = "";
      h = '<div class="c2-head plain"><b><i style="background:' + c.color + '"></i>' + esc(p.name) + "</b><span>" + esc(p.country) + "</span></div>";
    }
    var rows = "", pending = null;
    ROWS.forEach(function (r) {
      if (r[2]) { pending = '<tr class="sec"><td colspan="2">' + esc(L[r[0]] || "") + "</td></tr>"; return; }
      var v = r[1] === "status" ? (S.popupStatus ? c.label : "") : p.row[r[1]];
      if (v == null || String(v).trim() === "") return;
      if (r[3]) { var n = num(v); v = n == null ? v : DV.fmt(n, "", 0); }
      if (pending) { rows += pending; pending = null; }
      rows += "<tr><td>" + esc(L[r[0]] || r[0]) + "</td><td>" + esc(v) + "</td></tr>";
    });
    var border = S.popupHeader === "coloured block" ? c.color : "#e3e3e3";
    return h + '<div class="c2-body" style="border-color:' + border + '"><table>' + rows + "</table></div>";
  }

  /* No side panel on this map: hovering shows the popup. A plant picked in the search box gets its popup
   * next to it. Phones and touch screens have no hover, so a tap shows the details below the map instead. */
  function select(ctx, id, touch) {
    var S = ctx.S, p = state.byId[id];
    state.selected = p ? id : null;
    ui.view.select(state.selected, "bubble");
    ui.search.set(state.selected);
    var wasOpen = ui.panelOpen;
    ui.panelOpen = !!p && (touch || ctx.stacked);
    if (ui.panelOpen) ui.panelBody.innerHTML = info(S, p);
    if (ui.panelOpen || wasOpen) ctx.rerender();
    if (p && !ui.panelOpen && S.tooltipShow) ui.view.tipAt(id, info(S, p));
  }

  function makeUI(ctx) {
    var layout = DV.mapLayout(document.getElementById("map"), ctx.root);
    var view = DV.mapView(layout.stage);
    var panel = document.createElement("div"); panel.className = "dvm-panel dv-control c2-card";
    var close = document.createElement("button"); close.className = "dvm-panel-close"; close.type = "button";
    close.setAttribute("aria-label", "Close"); close.innerHTML = "&times;";
    var body = document.createElement("div");
    panel.appendChild(close); panel.appendChild(body);
    ui = { layout: layout, view: view, panel: panel, panelBody: body, panelOpen: false };
    view.tip.classList.add("c2-card");
    close.addEventListener("click", function () { select(ctx, null); });

    view.onHover = function (id, kind) {
      var p = kind === "bubble" && state.byId[id];
      return p && ctx.S.tooltipShow ? info(ctx.S, p) : "";
    };
    view.onClick = function (id, kind) {
      var touch = view.lastPointer === "touch" || view.lastPointer === "pen";
      // with a mouse, a click only highlights (the popup is already showing); a second click clears it
      select(ctx, kind === "bubble" && id !== state.selected ? id : null, touch);
    };

    ui.search = DV.mapSearch({
      items: state.plants.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .map(function (p) { return { id: p.id, label: p.name + " (" + p.country + ")" }; }),
      onSelect: function (id) { select(ctx, id); }
    });
  }

  function drawBubbles(ctx, w) {
    var S = ctx.S;
    var maxCap = Math.max.apply(null, state.plants.map(function (p) { return p.cap || 0; }));
    var r = DV.bubbleRadius(S, maxCap, w);
    ui.view.bubbles(state.plants.filter(function (p) { return !state.active || state.active[p.cat.code]; }).map(function (p) {
      return { id: p.id, lon: p.lon, lat: p.lat, r: r(p.cap), fill: p.cat.color, opacity: S.bubbleOpacity,
        stroke: S.bubbleStroke, strokeWidth: S.bubbleStrokeWidth };
    }));
    return r;
  }

  DV.create({
    sheetId: SHEET_ID,
    sheetTab: SHEET_TAB,
    fallback: FALLBACK,
    columns: ["Name", "Lat", "Lon", "Status", "Capacity (MW)"],
    text: true,

    groups: [
      { name: "Text", fields: [
        { key: "title",             type: "text", def: "Europe’s existing and planned gas power plants", help: "Main title (empty = none)" },
        { key: "footer",            type: "text", def: "Sources: [Beyond Fossil Fuels](https://beyondfossilfuels.org/gas/), [Global Energy Monitor](https://globalenergymonitor.org/) | Plant retirements tracked since Jan 2023 | Last update: July 2026", help: "Footer; [text](https://…) makes a link. Leave empty to hide" },
        { key: "notes",             type: "textarea", rows: 6, def: "Note: The status of Ukraine's gas units is as of 1 January 2022, prior to the full-scale Russian invasion of Ukraine. This information may not reflect their current status, as some units may have been damaged or destroyed in the war.", help: "Notes under the footer, one paragraph per line; [text](https://…) makes a link" },
        { key: "notesSize",         type: "range", min: 10, max: 24, step: 0.5, def: 14, help: "Notes text size in px" },
        { key: "legendTitle",       type: "text", def: "", help: "Legend title (empty = none)" },
        { key: "statusLabels",      type: "textarea", rows: 7, def: [
            "operating :: Operating",
            "mothballed :: Mothballed",
            "announced :: Announced",
            "pre-construction :: Pre-construction",
            "construction :: Construction",
            "shelved :: Shelved",
            "cancelled :: Cancelled",
            "retired :: Retired"
          ].join("\n"), help: "Legend wording, one line per status: code :: wording. The line order is the legend order" },
        { key: "popupLabels",       type: "textarea", rows: 16, def: [
            "general :: General information",
            "status :: Status:",
            "owner :: Owners:",
            "chp :: CHP:",
            "firstUnit :: Start year first unit:",
            "retiredIn :: Retired in:",
            "plannedRetirement :: Planned retirement last unit:",
            "capacity :: Capacity (MW)",
            "operating :: - Operating:",
            "mothballed :: - Mothballed:",
            "announced :: - Announced:",
            "preConstruction :: - Pre-construction:",
            "construction :: - Construction:",
            "shelved :: - Shelved:",
            "cancelled :: - Cancelled:",
            "retired :: - Retired:"
          ].join("\n"), help: "Popup wording, one line per row: key :: wording (rows with no data are left out)" },
        { key: "searchPlaceholder", type: "text", def: "Search power plants", help: "Search box placeholder" }
      ]},
      { name: "Legend and search", fields: [
        { key: "legendPos",    type: "select", options: DV.POSITIONS, def: "top-left corner", help: "Legend position (on phones, corners and sides move above the map)" },
        { key: "legendDir",    type: "select", options: ["vertical", "horizontal"], def: "vertical", help: "Legend direction" },
        { key: "legendGap",    type: "range", min: 0, max: 40, step: 1, def: 5, help: "Space between legend items in px (between rows when vertical, between items when horizontal)" },
        { key: "legendFilter", type: "check", def: true, help: "Click a legend item to show only that status" },
        { key: "searchPos",    type: "select", options: DV.POSITIONS, def: "top-right corner", help: "Plant search position" },
        { key: "searchWidth",  type: "range", min: 80, max: 400, step: 5, def: 180, help: "Search box width in px" }
      ]},
      { name: "Popup", fields: [
        { key: "tooltipShow",     type: "check", def: true, help: "Show a popup when hovering over a plant (mouse only)" },
        { key: "tooltipWidth",    type: "range", min: 180, max: 480, step: 5, def: 380, help: "Popup maximum width in px" },
        { key: "popupHeader",     type: "select", options: ["coloured block", "name with colour dot"], def: "coloured block", help: "Popup header: coloured block (as in Flourish) or the name with a colour dot" },
        { key: "popupHeaderText", type: "select", options: ["automatic", "white", "black"], def: "automatic", help: "Text colour on the coloured block (automatic: black or white, whichever reads better)" },
        { key: "popupStatus",     type: "check", def: false, help: "Show the status (legend wording) in the popup (Flourish didn't)" },
        { key: "popupLines",      type: "color", def: "#e6e6e6", help: "Lines between the popup rows" }
      ]}
    ].concat(DV.bubbleGroup(), DV.mapGroups({
      noDataShow: "BFF countries only", noDataFill: "#e4e5e7", borderWidth: 1.2, smallMode: "as they are",
      viewWest: -14, viewEast: 44, viewSouth: 33.5, viewNorth: 68,
      insetShow: true, insetWidth: 16, insetLon: -11, insetLat: 46.2, insetWest: -18.3, insetEast: -13.3, insetSouth: 27.5, insetNorth: 29.5
    })),

    build: function (ctx) {
      var S = ctx.S;
      prepare(ctx);
      if (!ui) makeUI(ctx);
      var st = ctx.root.style;
      st.setProperty("--dvm-search-width", S.searchWidth + "px");
      st.setProperty("--dvm-tip-width", S.tooltipWidth + "px");
      st.setProperty("--dvm-panel-size", S.tooltipSize + "px");
      st.setProperty("--c2-line", S.popupLines);
      document.getElementById("dv-title").style.display = S.title ? "" : "none";
      document.getElementById("notes").innerHTML = String(S.notes || "").split(/\n/).filter(function (l) { return l.trim(); })
        .map(function (l) { return "<p>" + DV.linkify(l) + "</p>"; }).join("");

      if (ui.legend) ui.legend.remove();
      state.active = null;
      ui.legend = DV.mapLegend({
        title: S.legendTitle,
        items: state.cats.map(function (c) { return { key: c.code, label: c.label, color: c.color }; }),
        onToggle: S.legendFilter ? function (active) { state.active = active; ctx.rerender(); } : null
      });
      ui.legend.setLayout(S.legendDir, S.legendGap);
      ui.search.setPlaceholder(S.searchPlaceholder);
      if (ui.panelOpen) ui.panelBody.innerHTML = info(S, state.byId[state.selected]);

      if (state.geometry !== S.geometry) {
        state.geometry = S.geometry;
        DV.loadGeo(S.geometry).then(function (topo) {
          if (state.geometry !== S.geometry) return;
          state.topo = topo;
          ctx.rerender();
        }, function (e) { console.warn("G3: map shapes could not be loaded (" + e.message + ")"); });
      }
    },

    render: function (ctx) {
      var S = ctx.S, narrow = ctx.stacked;
      ctx.root.style.setProperty("--c2-notes-size", ctx.sz(S.notesSize, 12) + "px");
      if (ui.sizeLegend) { ui.sizeLegend.remove(); ui.sizeLegend = null; }
      var w0 = ui.layout.stage.clientWidth || ctx.W;
      var maxCap = Math.max.apply(null, state.plants.map(function (p) { return p.cap || 0; }));
      var values = String(S.sizeLegendValues || "").split(/[,;\s]+/).map(Number).filter(function (v) { return v > 0; });
      if (S.sizeLegendPos !== "hidden" && values.length) {
        ui.sizeLegend = DV.bubbleLegend({ title: S.sizeLegendTitle, values: values, r: DV.bubbleRadius(S, maxCap, w0),
          fmt: function (v) { return DV.fmt(v, "", 0); } });
      }
      var list = [[ui.legend, S.legendPos]];
      if (ui.sizeLegend) list.push([ui.sizeLegend, S.sizeLegendPos]);
      list.push([ui.search, S.searchPos], [ui.panel, ui.panelOpen ? "below map" : "hidden", true]);
      ui.layout.place(list, narrow);
      if (!state.topo) return;

      var w = ui.layout.stage.clientWidth;
      var h = Math.round(w * (narrow ? S.mapHeightPhone : S.mapHeight));
      var view = Object.create(S);
      if (narrow) view.mapZoom = S.mapZoom * S.mapZoomPhone;
      ui.view.draw({
        S: S, width: w, height: h,
        projection: DV.mapProjection(view, w, h),
        features: DV.mapShapes(state.topo, S),
        style: function () { return null; },     // countries are background only (see "Countries without data")
        label: (S.title || "Gas plant map") + ": gas power plants in Europe by status and capacity"
      });
      drawBubbles(ctx, w);
    }
  });
})();
</script>
</body>
</html>
