  /* G6 is now the share view of G5 (merged November 2026): this address opens ../gas-fleet-by-country/ on that view.
   * The address options (?frame=card, ?design…) come along, and dvfrom tells the graphic its old address,
   * so the website's auto-height listener still finds this iframe. */

    var q = location.search.replace(/^\?/, "").split("&").filter(function (p) { return p && !/^dvfrom=/.test(p); });
    if (!q.some(function (p) { return /^view=/.test(p); })) q.push("view=share");
    q.push("dvfrom=" + encodeURIComponent(location.href));
    window.location.replace("../gas-fleet-by-country/?" + q.join("&") + location.hash);
  })();
</script>
