<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CO2 emissions by utility from coal power stations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../shared/v1/core.css">
<link rel="stylesheet" href="../shared/v1/charts.css">
<style>
  .small-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 22px; }
</style>
</head>
<body>
<div class="dv" id="dv">
  <h1 class="dv-title" id="dv-title"></h1>
  <div class="dvc-sub" id="sub"></div>
  <div class="dvc-grid" id="grid">
    <div class="dvc-panel" id="p-main">
      <p class="dvc-hint dv-control" id="hint"></p>
      <div id="legend"></div>
      <svg id="s-main"></svg><div class="dv-tooltip" id="t-main"></div>
      <p class="dvc-caption" id="cap-main"></p>
    </div>
    <div class="dvc-panel" id="p-small">
      <div class="small-grid" id="small"></div>
      <div class="dv-tooltip" id="t-small"></div>
      <p class="dvc-caption" id="cap-small"></p>
    </div>
  </div>
  <p class="dv-footer" id="dv-footer"></p>
  <div class="dvc-notes" id="notes"></div>
</div>

<script src="../shared/brand.js"></script>
<script>
// ==== SETTINGS START ====
/* ================================================================
 * DESIGN SETTINGS FOR THIS GRAPHIC
 * Change any value below to restyle this graphic. Colours are hex
 * codes, sizes are in pixels. Keep the quotes and the comma on each line.
 * Fonts, text colours and palette colours are shared by all graphics:
 * they live in shared/brand.js.
 * Easier: open this page with ?design at the end of its address to
 * adjust everything with sliders, then download the result.
 * ================================================================ */
var SETTINGS = {
  // ---- Text ----
  title: "CO2 emissions by utility from coal power stations in the EU+UK", // Main title
  subtitle: "Just seven utilities caused two-thirds of coal-based CO₂ emissions in 2025.", // Subtitle under the title, one paragraph per line (empty = none)
  subtitleSize: 18,                            // Subtitle size in px (shrinks on small screens)
  hint: "Click utility names below to toggle them off and on:", // Line above the legend (empty = none)
  mainCaption: "Utilities ranked by cumulative CO₂ emissions from coal power stations since {first}.", // Caption under the stacked bars; {first} = first year in the data
  smallCaption: "Utilities with the largest cumulative CO₂ emissions from coal power stations since {first}.", // Caption under the small charts; {first} = first year in the data
  note: "In 2025, just seven utilities were responsible for over two-thirds of coal emissions.", // Note next to the highlighted bar (empty = none)
  unitLabel: "Mt",                             // Unit after the numbers
  totalLabel: "Total",                         // Tooltip: total
  footer: "Source: [EU ETS](https://union-registry-data.ec.europa.eu/report/welcome), [UK ETS](https://reports.view-emissions-trading-registry.service.gov.uk/ets-reports.html), [Beyond Fossil Fuels](https://beyondfossilfuels.org/) | Last update: September 2026", // Footer; links as [text](https://…). Leave empty to hide
  notes: "",                                   // Notes under the footer, one paragraph per line; links as [text](https://…)

  // ---- Text sizes ----
  titleSize: 46,                               // Main title size in px (shrinks on small screens)
  headingSize: 21,                             // Chart heading (subtitle) size in px
  footerSize: 18,                              // Footer (footnote) text size in px
  legendSize: 14,                              // Legend text size in px
  axisSize: 14,                                // Axis label size in px
  tooltipSize: 14,                             // Tooltip (popup) text size in px

  // ---- Spacing ----
  padTop: 16,                                  // Space above the graphic in px
  padSides: 16,                                // Space left and right of the graphic in px
  padBottom: 12,                               // Space below the graphic in px

  // ---- Background ----
  bgMode: "brand colour",                      // Page background, brand colour: the brand Page background; transparent: the website shows through

  // ---- Stacked bars ----
  legendToggle: true,                          // Clicking a legend item hides or shows that utility
  barGap: 0.3,                                 // Space between bars, as a share of each bar's slot
  highlightLast: true,                         // Grey band behind the latest year
  highlightColor: "#efefef",                   // Colour of the band
  noteSize: 15,                                // Note size in px
  noteWidth: 180,                              // Widest a note line gets in px
  noteColor: "#555555",                        // Note colour

  // ---- Small charts ----
  showSmall: true,                             // Show the small charts for each utility
  smallHeadingSize: 19,                        // Small chart heading size in px
  smallHeight: 110,                            // Height of each small chart in px
  smallAxisSize: 12,                           // Axis label size on the small charts in px

  // ---- Layout ----
  chartHeight: 0.95,                           // Stacked bar chart height as a share of its width
  mainShare: 0.5,                              // Stacked bars' share of the width (side by side)
  chartGap: 40,                                // Space between the two halves in px
};
// ==== SETTINGS END ====
</script>
<script src="../shared/v1/core.js"></script>
<script src="../shared/v1/charts.js"></script>
<script>
(function () {
  /* ------------------------------------------------------------------
   * C6: CO2 emissions from coal power stations by utility (Mt), EU+UK.
   * Sheet tab "C6": Year, then one column per utility (any order), and "Other".
   * Utilities are ranked here by their total over all years; that one order is used for the
   * legend, the stacked bars (rank 1 at the bottom) and the small charts, with Other last.
   * Colours follow the rank (palette "Coal utilities": utility1 = largest…), so the colours
   * stay in place if the utilities in the data change.
   * Only the first block of years is read (a repeated year ends the data).
   * ------------------------------------------------------------------ */
  var SHEET_ID = "1pn2TOwSXL6ujuXxcuK5J7IdvVU25q-9BxPi6apM500w";
  var FALLBACK = [
    "Year\tRWE\tEPH\tPGE\tEnea\tCEZ\tUniper\tEnBW\tPPC\tOther",
    "2005\t132.8\t98.2\t72.7\t16.9\t25.8\t65.2\t19\t43\t424.9",
    "2006\t132.6\t97.1\t72.9\t18.7\t26.7\t69.5\t20.2\t40.6\t430.9",
    "2007\t131.6\t96.1\t70.6\t19.2\t28.7\t71.5\t19.2\t42.1\t493.7",
    "2008\t127.1\t93.9\t71.9\t18.1\t24.9\t66.7\t17.8\t41.4\t423",
    "2009\t115.9\t88.2\t67.9\t19.4\t23.7\t51.4\t15.7\t41.5\t385.7",
    "2010\t114.6\t86.3\t68.6\t20.5\t24\t55.9\t17.2\t40\t378.5",
    "2011\t113.5\t88.9\t71.2\t19.7\t24\t51.7\t16.6\t41.1\t403.1",
    "2012\t129.4\t94.5\t71.7\t18.7\t20.7\t57.5\t17.8\t42.4\t423.7",
    "2013\t122\t99.6\t73.5\t17.5\t18.9\t53.3\t19.8\t36.4\t407.7",
    "2014\t118.7\t93.9\t69.4\t19\t18.4\t39.1\t18.2\t34.3\t373.4",
    "2015\t122.9\t86.8\t68.1\t19.3\t19.1\t34\t16.7\t29.4\t376.6",
    "2016\t116.6\t81.4\t66.6\t20.8\t19.7\t31.5\t15.8\t23.1\t308.5",
    "2017\t109.6\t79.9\t67.7\t20.7\t18.8\t25.4\t16.1\t25.6\t299.8",
    "2018\t101.9\t79.7\t67.8\t23.6\t17.8\t21.3\t15.9\t22.7\t262.9",
    "2019\t73\t64.9\t58.2\t23\t17.5\t11.9\t11.5\t15.4\t186.1",
    "2020\t54.7\t55.6\t56.9\t19.7\t14\t9.8\t8.9\t9.1\t137.5",
    "2021\t66.4\t61.8\t68.3\t23.8\t15.1\t13\t15.5\t8\t151.8",
    "2022\t70.5\t63.4\t68\t24.3\t14.5\t14.9\t16.3\t7.9\t166",
    "2023\t47.7\t50.7\t54.7\t19.3\t13.1\t9.6\t9.6\t4.8\t112.4",
    "2024\t43.3\t45.3\t52.3\t18.4\t12.9\t6\t7.2\t4.1\t85.6",
    "2025\t40.4\t42.2\t44.7\t13\t12.7\t3\t11\t3.9\t71.6"
  ].join("\n");
  var hidden = {}, smalls = [];

  function cleanRows(data, P) {
    var seen = {}, out = [];
    for (var i = 0; i < data.length; i++) {
      if (seen[data[i][P]]) break;
      seen[data[i][P]] = true; out.push(data[i]);
    }
    return out;
  }
  function utilities(ctx) {
    var S = ctx.S, rows = cleanRows(ctx.data, ctx.P);
    var total = function (h) { return rows.reduce(function (a, d) { return a + (+d[h] || 0); }, 0); };
    var cols = ctx.headers.slice(1).filter(function (h) { return h; });
    var ranked = cols.filter(function (h) { return !/^other$/i.test(h); })
      .map(function (h) { return { h: h, t: total(h) }; }).sort(function (a, b) { return b.t - a.t; })
      .map(function (o, i) { return { key: o.h, label: o.h, other: false, color: S["utility" + (i + 1)] || S.utilityOther }; });
    return ranked.concat(cols.filter(function (h) { return /^other$/i.test(h); })
      .map(function (h) { return { key: h, label: h, other: true, color: S.utilityOther }; }));
  }

  DV.create({
    sheetId: SHEET_ID,
    sheetTab: "C6",
    fallback: FALLBACK,
    columns: ["Year"],

    groups: [
      DV.chartTextGroup({
        title: "CO2 emissions by utility from coal power stations in the EU+UK",
        subtitle: "Just seven utilities caused two-thirds of coal-based CO₂ emissions in 2025.",
        footer: "Source: [EU ETS](https://union-registry-data.ec.europa.eu/report/welcome), [UK ETS](https://reports.view-emissions-trading-registry.service.gov.uk/ets-reports.html), [Beyond Fossil Fuels](https://beyondfossilfuels.org/) | Last update: September 2026",
        extra: [
          { key: "hint",       type: "text", def: "Click utility names below to toggle them off and on:", help: "Line above the legend (empty = none)" },
          { key: "mainCaption", type: "text", def: "Utilities ranked by cumulative CO₂ emissions from coal power stations since {first}.", help: "Caption under the stacked bars; {first} = first year in the data" },
          { key: "smallCaption", type: "text", def: "Utilities with the largest cumulative CO₂ emissions from coal power stations since {first}.", help: "Caption under the small charts; {first} = first year in the data" },
          { key: "note",       type: "text", def: "In 2025, just seven utilities were responsible for over two-thirds of coal emissions.", help: "Note next to the highlighted bar (empty = none)" },
          { key: "unitLabel",  type: "text", def: "Mt", help: "Unit after the numbers" },
          { key: "totalLabel", type: "text", def: "Total", help: "Tooltip: total" }
        ]
      }),
      { name: "Stacked bars", fields: [
        { key: "legendToggle", type: "check", def: true, help: "Clicking a legend item hides or shows that utility" },
        { key: "barGap",       type: "range", min: 0, max: 0.6, step: 0.02, def: 0.3, help: "Space between bars, as a share of each bar's slot" },
        { key: "highlightLast", type: "check", def: true, help: "Grey band behind the latest year" },
        { key: "highlightColor", type: "color", def: "#efefef", help: "Colour of the band" },
        { key: "noteSize",     type: "range", min: 9, max: 24, step: 0.5, def: 15, help: "Note size in px" },
        { key: "noteWidth",    type: "range", min: 80, max: 400, step: 5, def: 180, help: "Widest a note line gets in px" },
        { key: "noteColor",    type: "color", def: "#555555", help: "Note colour" }
      ]},
      { name: "Small charts", fields: [
        { key: "showSmall",        type: "check", def: true, help: "Show the small charts for each utility" },
        { key: "smallHeadingSize", type: "range", min: 10, max: 30, step: 0.5, def: 19, help: "Small chart heading size in px" },
        { key: "smallHeight",      type: "range", min: 60, max: 260, step: 5, def: 110, help: "Height of each small chart in px" },
        { key: "smallAxisSize",    type: "range", min: 8, max: 18, step: 0.5, def: 12, help: "Axis label size on the small charts in px" }
      ]},
      { name: "Layout", fields: [
        { key: "chartHeight", type: "range", min: 0.4, max: 1.4, step: 0.02, def: 0.95, help: "Stacked bar chart height as a share of its width" },
        { key: "mainShare",   type: "range", min: 0.3, max: 0.7, step: 0.01, def: 0.5, help: "Stacked bars' share of the width (side by side)" },
        { key: "chartGap",    type: "range", min: 0, max: 100, step: 2, def: 40, help: "Space between the two halves in px" }
      ]}
    ],

    build: function (ctx) {
      var S = ctx.S;
      DV.chartText(S);
      document.getElementById("hint").textContent = S.legendToggle ? S.hint : "";
      var first = cleanRows(ctx.data, ctx.P)[0][ctx.P];
      document.getElementById("cap-main").textContent = S.mainCaption.replace(/\{first\}/g, first);
      document.getElementById("cap-small").textContent = S.showSmall ? S.smallCaption.replace(/\{first\}/g, first) : "";
      var us = utilities(ctx);
      var lg = DV.chartLegend({ items: us, toggle: S.legendToggle, hidden: hidden, onToggle: function () { ctx.rerender(); } });
      lg.classList.add("dvc-left");
      var host = document.getElementById("legend"); DV.clear(host); host.appendChild(lg);
      var small = document.getElementById("small"); DV.clear(small); smalls = [];
      document.getElementById("p-small").style.display = S.showSmall ? "" : "none";
      if (!S.showSmall) return;
      us.filter(function (u) { return !u.other; }).forEach(function (u) {
        var d = document.createElement("div"); d.className = "dvc-panel";
        var h = document.createElement("h3"); h.textContent = u.label; h.style.textAlign = "center"; d.appendChild(h);
        smalls.push({ u: u, svg: DV.el("svg", {}, d) });
        small.appendChild(d);
      });
    },

    render: function (ctx) {
      var S = ctx.S, P = ctx.P, un = S.unitLabel;
      DV.chartSizes(ctx);
      var rows = cleanRows(ctx.data, P), us = utilities(ctx);
      var grid = document.getElementById("grid");
      grid.style.setProperty("--dvc-gap-x", S.chartGap + "px");
      grid.style.gridTemplateColumns = ctx.stacked || !S.showSmall ? "1fr" : S.mainShare + "fr " + (1 - S.mainShare) + "fr";
      var shown = us.filter(function (u) { return !hidden[u.key]; });
      var w = document.getElementById("p-main").clientWidth;
      var h = DV.clamp(w * S.chartHeight, 240, 640);
      var tot = rows.map(function (d) { return shown.reduce(function (a, u) { return a + d[u.key]; }, 0); });
      var ax = DV.niceAxis(Math.max.apply(null, tot), 5);
      var last = rows.length - 1, svg = document.getElementById("s-main");
      var B = DV.bars({ S: S, svg: svg, tip: document.getElementById("t-main"), width: w, height: h, rows: rows,
        label: function (d) { return d[P]; }, xLabelAt: function (i) { return +rows[i][P] % 5 === 0; },
        gap: S.barGap, sep: S.pageBg === "transparent" ? "#fff" : S.pageBg, sepWidth: 0.5, series: shown,
        highlight: S.highlightLast ? { index: last, color: S.highlightColor } : null,
        yMax: ax.max, tickStep: ax.step, fmtY: function (v) { return DV.fmt(v, un, 0); },
        tooltip: function (i) {
          var html = "<b>" + rows[i][P] + "</b>";
          shown.forEach(function (u) { html += DV.tipRow(u.color, u.label, DV.fmt(rows[i][u.key], un, 1)); });
          return html + DV.tipRow("", S.totalLabel, DV.fmt(tot[i], un, 1), "t");
        } });
      if (S.note) {
        var nsz = ctx.sz(S.noteSize, 11);
        var t = DV.el("text", { "text-anchor": "end", "font-size": nsz, fill: S.noteColor }, svg);
        DV.multiline(t, S.note, B.x(last) - B.band * 0.6, B.m.top + nsz * 1.2, nsz * 1.3, Math.min(S.noteWidth, w * 0.45), nsz);
      }

      if (!S.showSmall) return;
      var tip = document.getElementById("t-small");
      smalls.forEach(function (sm) {
        var sw = sm.svg.parentNode.clientWidth, k = sm.u.key;
        var a = DV.niceAxis(Math.max.apply(null, rows.map(function (d) { return d[k]; })), 2);
        var every = sw < 260 ? 10 : 5;
        DV.bars({ S: S, svg: sm.svg, tip: tip, width: sw, height: S.smallHeight, rows: rows, fs: S.smallAxisSize,
          label: function (d) { return d[P]; }, xLabelAt: function (i) { return +rows[i][P] % every === 0; },
          gap: 0.2, series: [{ key: k, color: sm.u.color }], yMax: a.max, tickStep: a.step, top: 4,
          fmtY: function (v) { return DV.fmt(v, un, 0); },
          tooltip: function (i) { return "<b>" + sm.u.label + ", " + rows[i][P] + "</b>" + DV.tipRow(sm.u.color, "CO₂", DV.fmt(rows[i][k], un, 1)); } });
      });
    }
  });
})();
</script>
</body>
</html>
