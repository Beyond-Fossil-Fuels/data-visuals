    "CH\tSwitzerland\tNo coal ever in the electricity mix\t\t\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal\tno-coal",
    "TR\tTürkiye\tNo official coal phase-out discussion\t\t34.3\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion",
    "GB\tUnited Kingdom\tNo coal in electricity mix since 2024\t\t\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tby-2030\tno-coal\tno-coal\tno-coal\tno-coal",
    "UA\tUkraine\tCoal phase-out by 2035\t\t\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tno-discussion\tdiscussion\tdiscussion\tdiscussion\tafter-2030\tafter-2030\tafter-2030\tafter-2030\tafter-2030\tafter-2030\tafter-2030\tafter-2030\tafter-2030\tafter-2030"
  ].join("\n");

  // Status code -> colour in the brand palette ("Coal phase-out map").
  // The legend order and wording come from the "statusLabels" setting.
  var STATUS_COLORS = {
    "no-coal": "phaseoutNoCoal",
    "by-2030": "phaseout2030OrEarlier",
    "after-2030": "phaseoutAfter2030",
    "discussion": "phaseoutUnderDiscussion",
    "no-discussion": "phaseoutNoDiscussion"
  };
  var TEXT_COLUMNS = ["ISO", "Country", "Status detail", "Description", "Coal share"];

  var state = { rows: [], byId: {}, dates: [], cats: [], idx: 0, start: null, active: null, selected: null, topo: null, geometry: null };
  var ui = null;

  function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fill(text, vars) { return String(text || "").replace(/\{(\w+)\}/g, function (m, k) { return k in vars ? vars[k] : m; }); }

  // "code :: legend wording" lines -> categories in legend order
  function categories(S) {
    return String(S.statusLabels || "").split(/\n/).map(function (line) {
      var m = /^\s*(?:status\s+)?([\w-]+)\s*::\s*(.+?)\s*$/i.exec(line);
      if (!m) return null;
      var code = m[1].toLowerCase();
      if (!STATUS_COLORS[code]) { console.warn("C1: unknown status code '" + code + "' in the legend wording setting"); return null; }
      return { code: code, label: m[2], color: S[STATUS_COLORS[code]] };
    }).filter(Boolean);
  }
  // A status cell -> category (by code or by its legend wording)
  function category(v) {
    var n = norm(v);
    if (!n) return null;
    return state.cats.filter(function (c) { return norm(c.code) === n || norm(c.label) === n; })[0] || null;
  }

  function prepare(ctx) {
    state.cats = categories(ctx.S);
    state.dates = ctx.headers
      .filter(function (h) { return TEXT_COLUMNS.indexOf(h) < 0 && DV.parseDate(h) != null; })
      .map(function (h) { return { key: h, label: h, t: DV.parseDate(h) }; })
      .sort(function (a, b) { return a.t - b.t; });
    state.byId = {};
    state.rows = ctx.data.map(function (d) {
      var r = { id: DV.isoCode(d.ISO), name: d.Country || d.ISO, detail: d["Status detail"] || "", desc: d.Description || "",
        share: d["Coal share"] === "" || d["Coal share"] == null ? null : parseFloat(String(d["Coal share"]).replace(",", ".")) };
      r.cats = state.dates.map(function (dt) {
        var c = category(d[dt.key]);
        if (d[dt.key] && !c) console.warn("C1: unknown status '" + d[dt.key] + "' for " + r.name + " in " + dt.key);
        return c;
      });
      state.byId[r.id] = r;
      return r;
    });
  }

  // Fill colour of each country at the date shown (null = no data: design mode decides)
  function style(S) {
    return function (f) {
      var r = state.byId[f.id];
      if (!r) return null;
      var c = r.cats[state.idx];
      if (!c || (state.active && !state.active[c.code])) return { fill: S.noDataFill, on: true };
      return { fill: c.color, on: true };
    };
  }

  // One status line: coloured text, or black text with a coloured dot
  function statusLine(S, c, text) {
    if (!c) return '<div class="c1-status">' + esc(text) + "</div>";
    if (S.statusStyle === "black text with colour dot") {
      return '<div class="c1-status dot"><i style="background:' + c.color + '"></i><span>' + esc(text) + "</span></div>";
    }
    return '<div class="c1-status" style="color:' + c.color + '">' + esc(text) + "</div>";
  }

  // Popup / panel content
  function info(S, r) {
    var n = state.dates.length, latest = state.idx === n - 1, c = r.cats[state.idx], cNow = r.cats[n - 1];
    var now = r.detail || (cNow ? cNow.label : S.noDataText);
    var h = '<div class="c1-head"><img src="' + DV.sharedUrl + "flags/" + esc(r.id) + '.svg" alt="" onerror="this.remove()"><b>' + esc(r.name) + "</b></div>";
    if (S.pastStatus && !latest) {
      h += statusLine(S, c, fill(S.pastText, { date: state.dates[state.idx].label, status: c ? c.label : S.noDataText }));
      h += statusLine(S, cNow, fill(S.nowText, { status: now }));
    } else {
      h += statusLine(S, cNow, now);
    }
    if (r.desc) h += '<p class="c1-desc">' + esc(r.desc) + "</p>";
    if (r.share != null && isFinite(r.share)) {
      h += '<div class="c1-share"><div class="lab">' + esc(S.shareLabel) + '</div><div class="row"><div class="bar"><span style="width:' +
        DV.clamp(r.share, 0, 100) + "%;background:" + (cNow ? cNow.color : "#000") + '"></span></div><b>' + DV.fmt(r.share, "", 1) + "%</b></div></div>";
    }
    return h;
  }

  function select(ctx, id) {
    var S = ctx.S;
    state.selected = state.byId[id] ? id : null;
    ui.view.select(state.selected);
    ui.search.set(state.selected);
    ui.panelOpen = !!state.selected && S.panelPos !== "hidden";
    if (ui.panelOpen) ui.panelBody.innerHTML = info(S, state.byId[state.selected]);
    ctx.rerender();   // the panel may change the layout (and the iframe height)
  }

  function makeUI(ctx) {
    var layout = DV.mapLayout(document.getElementById("map"), ctx.root);
    var view = DV.mapView(layout.stage);
    var panel = document.createElement("div"); panel.className = "dvm-panel dv-control";
    var close = document.createElement("button"); close.className = "dvm-panel-close"; close.type = "button";
    close.setAttribute("aria-label", "Close"); close.innerHTML = "&times;";
    var body = document.createElement("div");
    panel.appendChild(close); panel.appendChild(body);
    ui = { layout: layout, view: view, panel: panel, panelBody: body, panelOpen: false };
    close.addEventListener("click", function () { select(ctx, null); });

    view.onHover = function (id) {
      var r = state.byId[id];
      return r && ctx.S.tooltipShow && !(state.selected === id && ui.panelOpen) ? info(ctx.S, r) : "";
    };
    view.onClick = function (id) { select(ctx, id === state.selected ? null : id); };

    ui.search = DV.mapSearch({
      items: state.rows.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .map(function (r) { return { id: r.id, label: r.name }; }),
      onSelect: function (id) { select(ctx, id); }
    });
    ui.slider = DV.timeSlider({
      dates: state.dates, index: state.dates.length - 1,
      onChange: function (i) {
        state.idx = i;
        ui.view.restyle();
        if (ui.panelOpen) ui.panelBody.innerHTML = info(ctx.S, state.byId[state.selected]);
      }
    });
  }

  DV.create({
    axes: false,   // no axes: design mode leaves out the axis label size
    sheetId: SHEET_ID,
    sheetTab: SHEET_TAB,
    fallback: FALLBACK,
    columns: ["ISO", "Country"],
    text: true,

    groups: [
      { name: "Text", fields: [
        { key: "title",             type: "text", def: "Overview of country coal phase-out announcements and plans in Europe", help: "Main title" },
        { key: "footer",            type: "text", def: "Source: [Beyond Fossil Fuels coal tracker](https://beyondfossilfuels.org/coal/) | Last update: {last}", help: "Footer; {last} is the newest date in the data; [text](https://…) makes a link. Leave empty to hide" },
        { key: "legendTitle",       type: "text", def: "", help: "Legend title (empty = none)" },
        { key: "statusLabels",      type: "textarea", rows: 5, def: [
            "no-coal :: No coal in electricity mix",
            "by-2030 :: Coal phase-out commitment 2030 or earlier",
            "after-2030 :: Coal phase-out commitment, but after 2030",
            "discussion :: Coal phase-out under official discussion",
            "no-discussion :: No official coal phase-out discussion"
          ].join("\n"), help: "Legend wording, one line per status: code :: wording. The line order is the legend order" },
        { key: "searchPlaceholder", type: "text", def: "Select country", help: "Search box placeholder" },
        { key: "shareLabel",        type: "text", def: "Coal % of power mix (Ember, 2025):", help: "Label above the coal share bar" },
        { key: "latestText",        type: "text", def: "Current ({date})", help: "Slider label at the newest date; {date} is that date" },
        { key: "pastText",          type: "text", def: "Status in {date}: {status}", help: "Popup status line for past dates; {date} and {status} are filled in" },
        { key: "nowText",           type: "text", def: "Current status: {status}", help: "Popup line with today's status, under the past status; {status} is filled in" },
        { key: "noDataText",        type: "text", def: "No data", help: "Popup text when a country has no status at that date" }
      ]},
      { name: "Legend and search", fields: [
        { key: "legendPos",    type: "select", options: DV.POSITIONS, def: "top-left corner", help: "Legend position (on phones, corners and sides move above the map)" },
        { key: "legendDir",    type: "select", options: ["vertical", "horizontal"], def: "vertical", help: "Legend direction" },
        { key: "legendGap",    type: "range", min: 0, max: 40, step: 1, def: 5, help: "Space between legend items in px (between rows when vertical, between items when horizontal)" },
        { key: "legendFilter", type: "check", def: true, help: "Click a legend item to show only that status" },
        { key: "searchPos",    type: "select", options: DV.POSITIONS, def: "top-right corner", help: "Country search position" },
        { key: "searchWidth",  type: "range", min: 80, max: 400, step: 5, def: 140, help: "Search box width in px" }
      ]},
      { name: "Popup and panel", fields: [
        { key: "tooltipShow",  type: "check", def: true, help: "Show a popup when hovering over a country (mouse only)" },
        { key: "tooltipWidth", type: "range", min: 180, max: 480, step: 5, def: 320, help: "Popup maximum width in px" },
        { key: "statusStyle",  type: "select", options: ["coloured text", "black text with colour dot"], def: "coloured text", help: "Status in the popup and panel" },
        { key: "pastStatus",   type: "check", def: true, help: "When the slider shows a past date, the popup gives that date's status and today's status" },
        { key: "panelPos",     type: "select", options: DV.PANEL_POSITIONS, def: "side panel (right)", help: "Panel opened by clicking a country or searching (on phones it goes below the map; hidden = no panel)" },
        { key: "panelWidth",   type: "range", min: 200, max: 480, step: 5, def: 340, help: "Panel width in px" },
        { key: "panelBg",      type: "color", def: "#f4f4f4", help: "Side panel background" },
        { key: "panelTextSize", type: "range", min: 11, max: 24, step: 0.5, def: 16, help: "Panel text size in px (the popup uses the brand tooltip size)" }
      ]}
    ].concat(DV.sliderGroup(), DV.mapGroups()),

    build: function (ctx) {
      var S = ctx.S;
      prepare(ctx);
      if (!ui) makeUI(ctx);
      var st = ctx.root.style;
      st.setProperty("--dvm-search-width", S.searchWidth + "px");
      st.setProperty("--dvm-tip-width", S.tooltipWidth + "px");
      st.setProperty("--dvm-panel-width", S.panelWidth + "px");
      st.setProperty("--dvm-panel-bg", S.panelBg);
      st.setProperty("--dvm-panel-size", S.panelTextSize + "px");

      var last = state.dates.length ? state.dates[state.dates.length - 1].label : "";
      document.getElementById("dv-footer").innerHTML = DV.linkify(fill(S.footer, { last: last }));

      // legend (rebuilt so wording and colour changes show)
      if (ui.legend) ui.legend.remove();
      state.active = null;
      ui.legend = DV.mapLegend({
        title: S.legendTitle,
        items: state.cats.map(function (c) { return { key: c.code, label: c.label, color: c.color }; }),
        onToggle: S.legendFilter ? function (active) { state.active = active; ui.view.restyle(); } : null
      });
      ui.legend.setLayout(S.legendDir, S.legendGap);
      ui.search.setPlaceholder(S.searchPlaceholder);

      // time slider: start date (applied when the setting changes), style and label
      if (state.start !== S.sliderStart) {
        state.start = S.sliderStart;
        state.idx = S.sliderStart === "earliest" ? 0 : state.dates.length - 1;
        ui.slider.set(state.idx);
      }
      ui.slider.setStyle(S);
      ui.slider.setLabel(function (i) {
        return i === state.dates.length - 1 ? fill(S.latestText, { date: state.dates[i].label }) : state.dates[i].label;
      });
      if (ui.panelOpen) ui.panelBody.innerHTML = info(S, state.byId[state.selected]);
      if (ui.view.features.length) ui.view.restyle(style(S));

      // country shapes (loaded once per choice, then the map redraws)
      if (state.geometry !== S.geometry) {
        state.geometry = S.geometry;
        DV.loadGeo(S.geometry).then(function (topo) {
          if (state.geometry !== S.geometry) return;
          state.topo = topo;
          var missing = state.rows.filter(function (r) { return !topo.objects.countries.geometries.some(function (g) { return g.id === r.id; }); });
          if (missing.length) console.warn("C1: no shape for " + missing.map(function (r) { return r.id + " (" + r.name + ")"; }).join(", "));
          ctx.rerender();
        }, function (e) { console.warn("C1: map shapes could not be loaded (" + e.message + ")"); });
      }
    },

    render: function (ctx) {
      var S = ctx.S, narrow = ctx.stacked;
      ui.layout.place([
        [ui.legend, S.legendPos],
        [ui.search, S.searchPos],
        [ui.panel, ui.panelOpen ? S.panelPos : "hidden", true],
        [ui.slider, state.dates.length > 1 ? S.sliderPos : "hidden", true]
      ], narrow);
      if (!state.topo) return;

      var w = ui.layout.stage.clientWidth;
      var h = DV.mapHeightFor(ctx, S, w, narrow, ui.layout.stage);   // same total height for every map (setting "Graphic height")
      var view = Object.create(S);
      if (narrow) view.mapZoom = S.mapZoom * S.mapZoomPhone;
      ui.view.draw({
        S: S, width: w, height: h,
        projection: DV.mapProjection(view, w, h),
        features: DV.mapShapes(state.topo, S),
        style: style(S),
        label: S.title + ": map of Europe coloured by coal phase-out status"
      });
    }
  });
})();
</script>
</body>
</html>
