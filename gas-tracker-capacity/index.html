<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracking the capacity of new gas projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../shared/v1/core.css">
<style>
  /* Right-hand column: two charts on top of each other */
  .right-col { display: flex; flex-direction: column; min-width: 0; }
</style>
</head>
<body>
<div class="dv" id="dv">
  <h1 class="dv-title" id="dv-title"></h1>
  <div class="dv-row" id="row">
    <div class="dv-chart" id="chart-left"></div>
    <div class="dv-arrow-down" aria-hidden="true"><svg id="arrow-down" width="60" height="58"></svg></div>
    <div class="right-col" id="right-col">
      <div class="dv-chart" id="chart-installed"></div>
      <div class="dv-chart" id="chart-cancelled"></div>
    </div>
    <svg class="dv-arrow" id="arrow" aria-hidden="true"></svg>
  </div>
  <p class="dv-footer" id="dv-footer"></p>
</div>

<script src="../shared/brand.js"></script>
<script>
// ==== SETTINGS START ====
/* ================================================================
 * DESIGN SETTINGS FOR THIS GRAPHIC
 * Change any value below to restyle this graphic. Colours are hex
 * codes, sizes are in pixels. Keep the quotes and the comma on each line.
 * Fonts, text colours and palette colours are shared by all graphics:
 * they live in shared/brand.js.
 * Easier: open this page with ?design at the end of its address to
 * adjust everything with sliders, then download the result.
 * ================================================================ */
var SETTINGS = {
  // ---- Text ----
  title: "Tracking the capacity of new gas projects", // Main title
  leftTitle: "In development",                 // Heading above the left chart
  installedTitle: "Installed",                 // Heading above the top-right chart
  cancelledTitle: "Cancelled",                 // Heading above the bottom-right chart
  footer: "Power plants tracked since {first} | Last update: {last}", // Footer; {first} and {last} are filled in from the data. Leave empty to hide
  unit: "GW",                                  // Unit shown on axes and in tooltips
  decimals: 1,                                 // Decimals shown in tooltips

  // ---- Label on the dark area ----
  areaLabelShow: true,                         // Show the label inside the dark area
  areaLabelText: "Already left development|since start of tracking", // Label text; use | for a line break
  areaLabelSize: 22,                           // Label size in px (shrinks on small screens)
  areaLabelWeight: 700,                        // Label boldness
  areaLabelColor: "#ffffff",                   // Label colour
  areaLabelWidth: 0.8,                         // Widest a label line gets, as a share of the chart width

  // ---- Colours ----
  colorAlreadyLeft: "#333333",                 // Dark area: already left development
  colorAlreadyLeftDots: "#000000",             // Line and dots on the dark area

  // ---- Layout ----
  chartGap: 170,                               // Space between the left chart and the right-hand charts, in px
  chartHeight: 0.84,                           // Left chart height as a share of its width
  rightGap: 40,                                // Space between the two right-hand charts, in px
  roundUpRightAxis: true,                      // Extend the right-hand axes to the next round number

  // ---- Arrow position ----
  arrowShow: true,                             // Show the arrows
  arrowLevel: 0.35,                            // Start height on the dark area (0 = bottom, 1 = top)
  arrowOffsetY: 0,                             // Nudge the arrow start up (-) or down (+), in px
  arrowStartGap: 14,                           // Space between the left chart and the arrow start, in px
  arrowEndGap: 8,                              // Space between the arrow tips and the right-hand charts, in px
  arrowTopTarget: 0.4,                         // Where the upper arrow points on the Installed chart (0 = bottom, 1 = top)
  arrowTopCurve: 0,                            // Upper arrow bend: 0 = straight
  arrowBottomOffsetY: 0,                       // Move the lower arrow tip up (-) or down (+), in px
  arrowBottomCurve: 0,                         // Lower arrow bend: 0 = straight
};
// ==== SETTINGS END ====
</script>
<script src="../shared/v1/core.js"></script>
<script>
(function () {
  /* ------------------------------------------------------------------
   * DATA: live from the "Gas tracker capacity" tab of the public Google Sheet.
   * FALLBACK is shown only if the sheet can't be reached; refresh it now
   * and then so it's never far behind. Blank cells count as 0.
   * ------------------------------------------------------------------ */
  var SHEET_ID = "1pn2TOwSXL6ujuXxcuK5J7IdvVU25q-9BxPi6apM500w";
  var SHEET_TAB = "Gas tracker capacity";
  var FALLBACK = [
    "YQ\tAnnounced\tPre-construction\tConstruction\tShelved\tAlready left development since start of tracking\tOperating\tMothballed\tCancelled",
    "2023\t15.4\t36.2\t14.6\t15.2\t10.4\t1.2\t\t9.2",
    "24Q1\t14.4\t36.1\t16\t16.7\t18.3\t5.9\t0.2\t12.1",
    "24Q2\t15.6\t37.2\t16.1\t16.6\t18.7\t6.3\t0.2\t12.1",
    "24Q3\t14.8\t35.2\t17.2\t17.4\t20\t7.7\t0.2\t12.1",
    "24Q4\t18.2\t36.7\t18.5\t15.2\t21.9\t9\t0.2\t12.6",
    "25Q1\t18.5\t39.1\t18.3\t14.6\t22.9\t10.1\t0.2\t12.6",
    "25Q2\t19.1\t40\t18\t15.6\t22.6\t10.4\t0.2\t11.9",
    "25Q3\t15.4\t43.9\t16.2\t15.7\t25.3\t12.8\t0.2\t12.2",
    "25Q4\t20\t44.3\t16.6\t11.7\t30.2\t13.8\t0.2\t16.2",
    "26Q1\t18.6\t43.2\t19.4\t9.2\t31.9\t13.8\t0.2\t17.9",
    "26Q2\t19.2\t43.2\t19.1\t8.9\t33.4\t15\t0.2\t18.2"
  ].join("\n");

  var LEFT = "Already left development since start of tracking";

  // Which columns go in which chart. Their ORDER comes from the sheet: each chart's columns are
  // listed top of the stack first, which is also the legend and tooltip order.
  // Colours come from the brand palette (shared/brand.js).
  var LEFT_KEYS = [LEFT, "Shelved", "Construction", "Pre-construction", "Announced"];
  var INSTALLED_KEYS = ["Mothballed", "Operating"];
  var CANCELLED_KEYS = ["Cancelled"];
  var PALETTE_KEY = { Announced: "gasAnnounced", "Pre-construction": "gasPreConstruction", Construction: "gasConstruction",
    Shelved: "gasShelved", Operating: "gasOperating", Mothballed: "gasMothballed", Cancelled: "gasCancelled" };

  // Stack series, bottom first (the reverse of the sheet's order)
  function series(ctx, keys) {
    var S = ctx.S;
    return DV.byColumns(ctx.headers, keys).reverse().map(function (k) {
      return k === LEFT
        ? { key: k, label: "Already left development", color: S.colorAlreadyLeftDots, fill: S.colorAlreadyLeft, lineOpacity: 0.6 }
        : { key: k, color: S[PALETTE_KEY[k]] };
    });
  }
  // Legend items in the sheet's order (the dark "already left" area is explained by the arrow instead)
  function legend(ctx, keys) {
    return DV.byColumns(ctx.headers, keys)
      .filter(function (k) { return k !== LEFT; })
      .map(function (k) { return { label: k, color: ctx.S[PALETTE_KEY[k]] }; });
  }

  var charts = {};

  DV.create({
    sheetId: SHEET_ID,
    sheetTab: SHEET_TAB,
    fallback: FALLBACK,
    columns: [LEFT, "Shelved", "Construction", "Pre-construction", "Announced", "Cancelled", "Mothballed", "Operating"],

    // Settings specific to this graphic (brand settings are in shared/brand.js)
    groups: [
      { name: "Text", fields: [
        { key: "title",          type: "text", def: "Tracking the capacity of new gas projects", help: "Main title" },
        { key: "leftTitle",      type: "text", def: "In development", help: "Heading above the left chart" },
        { key: "installedTitle", type: "text", def: "Installed", help: "Heading above the top-right chart" },
        { key: "cancelledTitle", type: "text", def: "Cancelled", help: "Heading above the bottom-right chart" },
        { key: "footer",         type: "text", def: "Power plants tracked since {first} | Last update: {last}", help: "Footer; {first} and {last} are filled in from the data. Leave empty to hide" },
        { key: "unit",           type: "text", def: "GW", help: "Unit shown on axes and in tooltips" },
        { key: "decimals",       type: "range", min: 0, max: 2, step: 1, def: 1, help: "Decimals shown in tooltips" }
      ]},
      { name: "Label on the dark area", fields: [
        { key: "areaLabelShow",   type: "check", def: true, help: "Show the label inside the dark area" },
        { key: "areaLabelText",   type: "text", def: "Already left development|since start of tracking", help: "Label text; use | for a line break" },
        { key: "areaLabelSize",   type: "range", min: 10, max: 40, step: 0.5, def: 22, help: "Label size in px (shrinks on small screens)" },
        { key: "areaLabelWeight", type: "select", options: [300, 400, 500, 600, 700, 800, 900], def: 700, help: "Label boldness" },
        { key: "areaLabelColor",  type: "color", def: "#ffffff", help: "Label colour" },
        { key: "areaLabelWidth",  type: "range", min: 0.3, max: 1, step: 0.05, def: 0.8, help: "Widest a label line gets, as a share of the chart width" }
      ]},
      { name: "Colours", fields: [
        { key: "colorAlreadyLeft",     type: "color", def: "#333333", help: "Dark area: already left development" },
        { key: "colorAlreadyLeftDots", type: "color", def: "#000000", help: "Line and dots on the dark area" }
      ]},
      { name: "Layout", fields: [
        { key: "chartGap",         type: "range", min: 40, max: 300, step: 2, def: 170, help: "Space between the left chart and the right-hand charts, in px" },
        { key: "chartHeight",      type: "range", min: 0.5, max: 1.4, step: 0.02, def: 0.84, help: "Left chart height as a share of its width" },
        { key: "rightGap",         type: "range", min: 0, max: 120, step: 2, def: 40, help: "Space between the two right-hand charts, in px" },
        { key: "roundUpRightAxis", type: "check", def: true, help: "Extend the right-hand axes to the next round number" }
      ]},
      { name: "Arrow position", fields: [
        { key: "arrowShow",          type: "check", def: true, help: "Show the arrows" },
        { key: "arrowLevel",         type: "range", min: 0, max: 1, step: 0.05, def: 0.35, help: "Start height on the dark area (0 = bottom, 1 = top)" },
        { key: "arrowOffsetY",       type: "range", min: -200, max: 200, step: 1, def: 0, help: "Nudge the arrow start up (-) or down (+), in px" },
        { key: "arrowStartGap",      type: "range", min: -40, max: 120, step: 1, def: 14, help: "Space between the left chart and the arrow start, in px" },
        { key: "arrowEndGap",        type: "range", min: -40, max: 120, step: 1, def: 8, help: "Space between the arrow tips and the right-hand charts, in px" },
        { key: "arrowTopTarget",     type: "range", min: 0, max: 1, step: 0.05, def: 0.4, help: "Where the upper arrow points on the Installed chart (0 = bottom, 1 = top)" },
        { key: "arrowTopCurve",      type: "range", min: -150, max: 150, step: 1, def: 0, help: "Upper arrow bend: 0 = straight" },
        { key: "arrowBottomOffsetY", type: "range", min: -200, max: 200, step: 1, def: 0, help: "Move the lower arrow tip up (-) or down (+), in px" },
        { key: "arrowBottomCurve",   type: "range", min: -150, max: 150, step: 1, def: 0, help: "Lower arrow bend: 0 = straight" }
      ]}
    ],

    // Headings and legends (re-run when settings change)
    build: function (ctx) {
      var S = ctx.S;
      charts.left = DV.chartBox(document.getElementById("chart-left"), S.leftTitle, legend(ctx, LEFT_KEYS));
      charts.installed = DV.chartBox(document.getElementById("chart-installed"), S.installedTitle, legend(ctx, INSTALLED_KEYS));
      charts.cancelled = DV.chartBox(document.getElementById("chart-cancelled"), S.cancelledTitle, []);
    },

    // Charts and arrows (re-run on every resize)
    render: function (ctx) {
      var S = ctx.S, data = ctx.data, stacked = ctx.stacked;
      var row = document.getElementById("row"), col = document.getElementById("right-col");
      row.style.columnGap = stacked ? "0px" : Math.max(Math.min(56, S.chartGap), Math.min(S.chartGap, ctx.W * 0.14)) + "px";
      var rightGap = stacked ? 16 : ctx.sz(S.rightGap, 16);
      col.style.rowGap = rightGap + "px";
      DV.alignHeads([charts.left.head, charts.installed.head], !stacked);

      // Sizes: in the wide layout the two right-hand charts together match the left chart's height
      var w = charts.left.box.clientWidth, wr = charts.installed.box.clientWidth;
      var hL, hR;
      if (stacked) {
        hL = DV.clamp(w * S.chartHeight * 0.8, 220, 440);
        hR = DV.clamp(w * 0.5, 160, 280);
      } else {
        hL = DV.clamp(w * S.chartHeight, 260, 760);
        var total = charts.left.head.offsetHeight + hL;
        hR = Math.max(120, (total - charts.installed.head.offsetHeight - charts.cancelled.head.offsetHeight - rightGap) / 2);
      }

      var ls = series(ctx, LEFT_KEYS), is = series(ctx, INSTALLED_KEYS), cs = series(ctx, CANCELLED_KEYS);
      var scL = DV.scale(DV.stackMax(data, ls), false);
      // The two right-hand charts share one scale so they compare directly
      var scR = DV.scale(Math.max(DV.stackMax(data, is), DV.stackMax(data, cs)), S.roundUpRightAxis);
      var common = { S: S, data: data, period: ctx.P, unit: S.unit, decimals: S.decimals };

      var L = DV.stackedArea(Object.assign({}, common, {
        svg: charts.left.svg, tip: charts.left.tip, width: w, height: hL, series: ls,
        yMax: scL.max, tickStep: scL.step,
        label: S.areaLabelShow ? { text: S.areaLabelText, size: ctx.sz(S.areaLabelSize, 11), weight: S.areaLabelWeight,
          color: S.areaLabelColor, width: S.areaLabelWidth } : null,
        totals: function (d) {
          var inDev = d.Shelved + d.Construction + d["Pre-construction"] + d.Announced;
          return [["In development", inDev], ["Total tracked", inDev + d[LEFT]]];
        }
      }));
      var I = DV.stackedArea(Object.assign({}, common, {
        svg: charts.installed.svg, tip: charts.installed.tip, width: wr, height: hR, series: is,
        yMax: scR.max, tickStep: scR.step,
        totals: function (d) { return [["Total installed", d.Mothballed + d.Operating]]; }
      }));
      DV.stackedArea(Object.assign({}, common, {
        svg: charts.cancelled.svg, tip: charts.cancelled.tip, width: wr, height: hR, series: cs,
        yMax: scR.max, tickStep: scR.step
      }));

      // Arrows: from one point on the dark "already left" layer to each right-hand chart
      var over = document.getElementById("arrow"), down = document.getElementById("arrow-down");
      DV.clear(down);
      var at = DV.overlay(over, row);
      ctx.root.classList.toggle("dv-no-arrow", !S.arrowShow);
      if (!S.arrowShow) return;
      if (stacked) { DV.arrow(down, 30, 2, 30, 56, S, 0, 0.75); return; }
      var last = data.length - 1, scale = Math.max(0.6, ctx.k);
      var a = at(charts.left.svg, L.x(last) + S.arrowStartGap, L.y(data[last][LEFT] * S.arrowLevel));
      a.y += S.arrowOffsetY;
      var t = at(charts.installed.svg, 0, I.m.top + I.ih * (1 - S.arrowTopTarget));
      var c = at(charts.cancelled.svg, 0, 0);
      if (t.x - S.arrowEndGap - a.x > 20) {
        DV.arrow(over, a.x, a.y, t.x - S.arrowEndGap, t.y, S, S.arrowTopCurve, scale);
        DV.arrow(over, a.x, a.y, c.x - S.arrowEndGap, a.y + S.arrowBottomOffsetY, S, S.arrowBottomCurve, scale);
      }
    }
  });
})();
</script>
</body>
</html>
