<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Moved to sustainable-by-design</title>
<link rel="canonical" href="../sustainable-by-design/">
<script>
  /* This graphic has a new address: ../sustainable-by-design/ (renamed 2 Nov 2026, with the section tag "Sustainable by design"). Old embeds keep working:
   * the address options (?frame=card, ?type=rows, ?design…) come along, and dvfrom tells
   * the graphic its old address, so the website's auto-height listener still finds this iframe. */
  (function () {
    var q = location.search.replace(/^\?/, "").split("&").filter(function (p) { return p && !/^dvfrom=/.test(p); });
    q.push("dvfrom=" + encodeURIComponent(location.href));
    window.location.replace("../sustainable-by-design/?" + q.join("&") + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="1; url=../sustainable-by-design/">
</head>
<body><p><a href="../sustainable-by-design/">This graphic has moved to a new address.</a></p></body>
</html>
