    state.byId = {};
    state.rows = ctx.data.map(function (d) {
      var r = { id: DV.isoCode(d.ISO), name: d.Country || d.ISO, detail: d["Status detail"] || "", note: d.Note || "" };
      r.values = state.dates.map(function (dt) { return num(d[dt.key]); });
      state.byId[r.id] = r;
      return r;
    });
  }

  function style(S) {
    var col = scale(S);
    return function (f) {
      var r = state.byId[f.id];
      if (!r) return null;
      var v = r.values[state.idx];
      return { fill: v == null ? S.noDataFill : col(v), on: true };
    };
  }

  function info(S, r) {
    var v = r.values[state.idx], year = state.dates[state.idx].label;
    var h = '<div class="c3-head">' + (S.flagShow ? '<img src="' + DV.sharedUrl + "flags/" + esc(r.id) + '.svg" alt="" onerror="this.remove()">' : "") +
      "<b>" + esc(r.name) + "</b></div>";
    h += '<div class="c3-value"><i style="background:' + (v == null ? S.noDataFill : scale(S)(v)) + '"></i><span>' +
      esc(v == null ? fill(S.noDataText, { year: year }) : fill(S.valueText, { year: year, value: DV.fmt(v, "", 1) })) + "</span></div>";
    if (S.statusShow && r.detail) h += '<div class="c3-line">' + esc(fill(S.statusText, { status: r.detail })) + "</div>";
    if (r.note) h += '<div class="c3-note">' + esc(r.note) + "</div>";
    return h;
  }

  function select(ctx, id) {
    var S = ctx.S;
    state.selected = state.byId[id] ? id : null;
    ui.view.select(state.selected);
    ui.search.set(state.selected);
    ui.panelOpen = !!state.selected && S.panelPos !== "hidden";
    if (ui.panelOpen) ui.panelBody.innerHTML = info(S, state.byId[state.selected]);
    ctx.rerender();
  }

  function makeUI(ctx) {
    var layout = DV.mapLayout(document.getElementById("map"), ctx.root);
    var view = DV.mapView(layout.stage);
    var panel = document.createElement("div"); panel.className = "dvm-panel dv-control";
    var close = document.createElement("button"); close.className = "dvm-panel-close"; close.type = "button";
    close.setAttribute("aria-label", "Close"); close.innerHTML = "&times;";
    var body = document.createElement("div");
    panel.appendChild(close); panel.appendChild(body);
    ui = { layout: layout, view: view, panel: panel, panelBody: body, panelOpen: false };
    close.addEventListener("click", function () { select(ctx, null); });
    view.onHover = function (id) {
      var r = state.byId[id];
      return r && ctx.S.tooltipShow && !(state.selected === id && ui.panelOpen) ? info(ctx.S, r) : "";
    };
    view.onClick = function (id) { select(ctx, id === state.selected ? null : id); };
    ui.search = DV.mapSearch({
      items: state.rows.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .map(function (r) { return { id: r.id, label: r.name }; }),
      onSelect: function (id) { select(ctx, id); }
    });
    ui.slider = DV.timeSlider({
      dates: state.dates, index: state.dates.length - 1,
      onChange: function (i) {
        state.idx = i;
        ui.view.restyle();
        if (ui.panelOpen) ui.panelBody.innerHTML = info(ctx.S, state.byId[state.selected]);
      }
    });
  }

  DV.create({
    sheetId: SHEET_ID,
    sheetTab: SHEET_TAB,
    fallback: FALLBACK,
    columns: ["ISO", "Country"],
    text: true,

    groups: [
      { name: "Text", fields: [
        { key: "title",        type: "text", def: "CO2 emissions from coal power plants in Europe", help: "Main title" },
        { key: "subtitle",     type: "textarea", rows: 4, def: "Coal is a disaster for climate change. While Europe is clearly heading towards a 2030 end to coal power, its many remaining plants still pump vast quantities of carbon dioxide into the air, heating our atmosphere. This map shows which countries emit the most, and how this has changed over time (2005-2025).", help: "Text under the title (empty = none)" },
        { key: "subtitleSize", type: "range", min: 11, max: 28, step: 0.5, def: 17, help: "Text under the title: size in px" },
        { key: "footer",       type: "text", def: "Sources: [European Environment Agency](https://www.eea.europa.eu/), [Beyond Fossil Fuels](https://beyondfossilfuels.org/coal/)", help: "Footer; [text](https://…) makes a link; {last} is the newest year. Leave empty to hide" },
        { key: "legendTitle",  type: "text", def: "CO2 emissions from coal power (Mt)", help: "Colour legend title (empty = none)" },
        { key: "valueText",    type: "text", def: "{value} Mt CO2 in {year}", help: "Popup value line; {value} and {year} are filled in" },
        { key: "noDataText",   type: "text", def: "No data for {year}", help: "Popup line when there's no value; {year} is filled in" },
        { key: "statusText",   type: "text", def: "Phase-out status: {status}", help: "Popup status line; {status} is the Status detail column" },
        { key: "searchPlaceholder", type: "text", def: "Select country", help: "Search box placeholder" },
        { key: "latestText",   type: "text", def: "{date}", help: "Slider label at the newest year; {date} is that year" }
      ]},
      { name: "Colour scale", fields: [
        { key: "colorStops", type: "textarea", rows: 8, def: [
            "0 :: #5fd35f", "40 :: #c9c24a", "80 :: #e8b13e", "120 :: #b98431", "180 :: #7a5521", "250 :: #3a2a12", "300 :: #000000"
          ].join("\n"), help: "Colour stops, one per line: value (Mt) :: colour. Colours blend between stops; the last value is the top of the scale" },
        { key: "colorSteps", type: "check", def: false, help: "Use solid colour steps between the stops instead of blending" },
        { key: "legendPos",  type: "select", options: DV.POSITIONS, def: "above map", help: "Colour legend position" },
        { key: "legendWidth", type: "range", min: 100, max: 500, step: 5, def: 340, help: "Colour legend width in px" },
        { key: "legendUnit", type: "text", def: "Mt", help: "Unit after the legend's end values" }
      ]},
      { name: "Search, popup and panel", fields: [
        { key: "searchPos",    type: "select", options: DV.POSITIONS, def: "top-left corner", help: "Country search position" },
        { key: "searchWidth",  type: "range", min: 80, max: 400, step: 5, def: 140, help: "Search box width in px" },
        { key: "tooltipShow",  type: "check", def: true, help: "Show a popup when hovering over a country (mouse only)" },
        { key: "tooltipWidth", type: "range", min: 180, max: 480, step: 5, def: 300, help: "Popup maximum width in px" },
        { key: "flagShow",     type: "check", def: true, help: "Show the country's flag" },
        { key: "statusShow",   type: "check", def: true, help: "Show the coal phase-out status in the popup" },
        { key: "panelPos",     type: "select", options: DV.PANEL_POSITIONS, def: "side panel (right)", help: "Panel opened by clicking a country or searching (on phones it goes below the map; hidden = no panel)" },
        { key: "panelWidth",   type: "range", min: 200, max: 480, step: 5, def: 340, help: "Panel width in px" },
        { key: "panelBg",      type: "color", def: "#f4f4f4", help: "Side panel background" },
        { key: "panelTextSize", type: "range", min: 11, max: 24, step: 0.5, def: 16, help: "Panel text size in px" }
      ]}
    ].concat(DV.sliderGroup({ sliderStart: "earliest", sliderPos: "above map" }), DV.mapGroups({ noDataFill: "#e3e4e6" })),

    build: function (ctx) {
      var S = ctx.S;
      prepare(ctx);
      if (!ui) makeUI(ctx);
      var st = ctx.root.style;
      st.setProperty("--dvm-search-width", S.searchWidth + "px");
      st.setProperty("--dvm-tip-width", S.tooltipWidth + "px");
      st.setProperty("--dvm-panel-width", S.panelWidth + "px");
      st.setProperty("--dvm-panel-bg", S.panelBg);
      st.setProperty("--dvm-panel-size", S.panelTextSize + "px");
      document.getElementById("subtitle").innerHTML = DV.linkify(S.subtitle || "");
      var last = state.dates.length ? state.dates[state.dates.length - 1].label : "";
      document.getElementById("dv-footer").innerHTML = DV.linkify(fill(S.footer, { last: last }));

      // colour legend: the scale's colours from its lowest to highest stop
      var col = scale(S);
      if (ui.legend) ui.legend.remove();
      var colors = [];
      for (var i = 0; i <= 30; i++) colors.push(col(col.min + (col.max - col.min) * i / 30));
      ui.legend = DV.gradientLegend({ title: S.legendTitle, colors: colors, min: col.min, max: col.max,
        fmt: function (v) { return DV.fmt(v, S.legendUnit, 0); } });
      Array.prototype.forEach.call(ui.legend.querySelectorAll(".dvm-bar, .dvm-bar-labels"), function (e) { e.style.width = S.legendWidth + "px"; e.style.maxWidth = "100%"; });
      ui.search.setPlaceholder(S.searchPlaceholder);

      if (state.start !== S.sliderStart) {
        state.start = S.sliderStart;
        state.idx = S.sliderStart === "earliest" ? 0 : state.dates.length - 1;
        ui.slider.set(state.idx);
      }
      ui.slider.setStyle(S);
      ui.slider.setLabel(function (i) {
        return i === state.dates.length - 1 ? fill(S.latestText, { date: state.dates[i].label }) : state.dates[i].label;
      });
      if (ui.panelOpen) ui.panelBody.innerHTML = info(S, state.byId[state.selected]);
      if (ui.view.features.length) ui.view.restyle(style(S));

      if (state.geometry !== S.geometry) {
        state.geometry = S.geometry;
        DV.loadGeo(S.geometry).then(function (topo) {
          if (state.geometry !== S.geometry) return;
          state.topo = topo;
          ctx.rerender();
        }, function (e) { console.warn("C3: map shapes could not be loaded (" + e.message + ")"); });
      }
    },

    render: function (ctx) {
      var S = ctx.S, narrow = ctx.stacked;
      ctx.root.style.setProperty("--c3-sub-size", ctx.sz(S.subtitleSize, 14) + "px");
      ui.layout.place([
        [ui.slider, state.dates.length > 1 ? S.sliderPos : "hidden"],
        [ui.legend, S.legendPos],
        [ui.search, S.searchPos],
        [ui.panel, ui.panelOpen ? S.panelPos : "hidden", true]
      ], narrow);
      if (!state.topo) return;
      var w = ui.layout.stage.clientWidth;
      var h = Math.round(w * (narrow ? S.mapHeightPhone : S.mapHeight));
      var view = Object.create(S);
      if (narrow) view.mapZoom = S.mapZoom * S.mapZoomPhone;
      ui.view.draw({
        S: S, width: w, height: h,
        projection: DV.mapProjection(view, w, h),
        features: DV.mapShapes(state.topo, S),
        style: style(S),
        label: S.title + ": map of Europe coloured by CO2 emissions from coal power"
      });
    }
  });
})();
</script>
</body>
</html>
