<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid-scale battery capacity: top 5 European countries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../shared/v1/core.css">
<link rel="stylesheet" href="../shared/v1/charts.css">
</head>
<body>
<div class="dv" id="dv">
  <h1 class="dv-title" id="dv-title"></h1>
  <div class="dvc-sub" id="sub"></div>
  <div class="dvc-panel" id="panel"><div id="legend"></div><svg id="chart"></svg><div class="dv-tooltip" id="tip"></div></div>
  <p class="dv-footer" id="dv-footer"></p>
  <div class="dvc-notes" id="notes"></div>
</div>

<script src="../shared/brand.js"></script>
<script>
// ==== SETTINGS START ====
/* ================================================================
 * DESIGN SETTINGS FOR THIS GRAPHIC
 * Change any value below to restyle this graphic. Colours are hex
 * codes, sizes are in pixels. Keep the quotes and the comma on each line.
 * Fonts, text colours and palette colours are shared by all graphics:
 * they live in shared/brand.js.
 * Easier: open this page with ?design at the end of its address to
 * adjust everything with sliders, then download the result.
 * ================================================================ */
var SETTINGS = {
  // ---- Text ----
  title: "Top 5 European countries for installed and planned grid-scale battery capacity", // Main title
  subtitle: "",                                // Subtitle under the title, one paragraph per line (empty = none)
  unitLabel: "GW",                             // Unit after the numbers (axis and tooltip)
  totalLabel: "Total",                         // Tooltip: total
  footer: "Source: [European Energy Storage Inventory, Joint Research Centre](https://ses.jrc.ec.europa.eu/storage-inventory) | Last update: October 2026", // Footer; links as [text](https://…). Leave empty to hide
  notes: "",                                   // Notes under the footer, one paragraph per line; links as [text](https://…)
  // Text sizes:
  titleSize: 32,                               // Main title size in px (shrinks on small screens)
  headingSize: 21,                             // Chart heading (subtitle) size in px
  footerSize: 14,                              // Footer (sources and notes) text size in px (never larger than the legend)
  legendSize: 14,                              // Legend text size in px
  axisSize: 14,                                // Axis label size in px
  tooltipSize: 14,                             // Tooltip (popup) text size in px
  subtitleSize: 18,                            // Subtitle size in px (shrinks on small screens)
  labelSize: 19,                               // Country name size in px

  // ---- Spacing ----
  padTop: 16,                                  // Space above the graphic in px
  padSides: 16,                                // Space left and right of the graphic in px
  padBottom: 12,                               // Space below the graphic in px
  blockGap: 14,                                // Space between the title, subtitle, buttons, charts and footer, in px (the same everywhere)

  // ---- Background ----
  bgMode: "white",                             // Page background, brand colour: the brand Page background; transparent: the website shows through

  // ---- Status colours ----
  statusColors: "Operational :: #A954D1\nAnnounced :: #FFA3A3\nPermitted :: #F46245\nUnder construction :: #F92B21\nInactive :: #AFA36A", // One line per status: column name :: #colour (starts from the brand's gas status colours)

  // ---- Bars ----
  topN: 5,                                     // Countries shown (the largest by total capacity)
  legendToggle: true,                          // Clicking a legend item hides or shows that status
  legendPos: "left",                           // Legend alignment
  rowHeight: 64,                               // Height of each country's row in px
  barGap: 0.2,                                 // Space between bars, as a share of the row
  labelWeight: 700,                            // Country name boldness
  showTotals: false,                           // Show each country's total after its bar
  decimals: 1,                                 // Decimals in the tooltip

  // ---- Axis lines ----
  gridShow: true,                              // Show vertical axis lines
  gridValues: "0, 25, 50, 75, 100",            // Where to draw them (GW), separated by commas; the axis numbers follow them (empty = automatic)
  gridLineColor: "#d9d9d9",                    // Axis line colour
};
// ==== SETTINGS END ====
</script>
<script src="../shared/v1/core.js"></script>
<script src="../shared/v1/charts.js"></script>
<script>
(function () {
  /* ------------------------------------------------------------------
   * F3: installed and planned grid-scale battery capacity (GW) by country.
   * Sheet tab "F3": Country, then one column per status, left to right (= legend order),
   * one row per country (all countries; the chart shows the largest ones, setting
   * "Countries shown"). Status colours are set in this graphic ("Status colours"),
   * starting from the brand's gas status colours.
   * ------------------------------------------------------------------ */
  var SHEET_ID = "1pn2TOwSXL6ujuXxcuK5J7IdvVU25q-9BxPi6apM500w";
  var FALLBACK = [
    "Country\tOperational\tAnnounced\tPermitted\tUnder construction\tInactive",
    "United Kingdom\t10.87663\t25.7396\t42.57869\t5.9705\t7.89403",
    "Germany\t10.21129\t16.15497\t0.58\t2.4115\t0.77287",
    "Spain\t7.69\t13.38556\t2.86328\t1.1808\t0.49056",
    "Italy\t9.03654\t4.19065\t5.59402\t1.41\t0.5853",
    "Poland\t2.18876\t9.7032\t7.4263\t0.953\t0.0075",
    "Romania\t0.93066\t4.9622\t2.5133\t1.251\t",
    "France\t6.48576\t0.698\t0.4\t0.558\t0.18317",
    "Portugal\t2.9536\t2.21827\t0.081\t0.077\t1.178",
    "Switzerland\t4.3068\t0.2586\t0.3\t0.945\t",
    "Austria\t4.49709\t0.156\t0.02107\t0.965\t",
    "Greece\t0.77507\t0.82218\t1.63288\t0.935\t0.92912",
    "Belgium\t1.8042\t1.2748\t0.9023\t1.027\t0.024",
    "Netherlands\t0.42756\t2.105\t1.55\t0.5266\t0.013",
    "Finland\t1.38713\t1.572\t0.14\t0.6475\t0.03512",
    "Ireland\t1.2845\t0.414\t0.127\t\t1.91564",
    "Bulgaria\t1.91005\t0.36096\t0.41085\t0.271\t0.648",
    "Ukraine\t2.171\t\t\t0.972\t",
    "Sweden\t0.95606\t1.62\t0.264\t0.0939\t0.015",
    "Croatia\t0.2884\t2.1\t\t\t0.06",
    "Lithuania\t1.126\t0.313\t0.166\t0.51551\t",
    "Czechia\t1.22599\t0.16\t0.13\t0.307\t0.01",
    "Norway\t1.01053\t0.6414\t\t\t0.00001",
    "Slovakia\t0.9433\t\t0.025\t\t0.3846",
    "Luxembourg\t1.294\t\t\t\t",
    "Turkey\t0.0335\t0.7905\t\t\t0.25",
    "Denmark\t0.20425\t0.1706\t0.359\t0.3385\t0.001",
    "Serbia\t0.6423\t0.263\t0.036\t\t",
    "Latvia\t0.11122\t0.44498\t0.1\t0.096\t",
    "Estonia\t0.2355\t0.025\t0.144\t0.235\t",
    "Hungary\t0.1966\t0.03\t0.25\t0.111\t",
    "Bosnia and Herzegovina\t0.42\t\t\t\t",
    "Slovenia\t0.24761\t0.007\t\t0.07\t",
    "North Macedonia\t0.04\t0.062\t\t0.095\t",
    "Albania\t0.024\t0.13\t\t0.02\t",
    "Kosovo\t\t\t\t\t0.17",
    "Cyprus\t\t0.041\t0.099\t\t0.005",
    "Montenegro\t\t0.06\t\t\t"
  ].join("\n");
  var STATUSES = ["Operational", "Announced", "Permitted", "Under construction", "Inactive"];
  var hidden = {};

  // "Status :: #colour" lines -> { Status: colour }
  function colours(S) {
    var out = {};
    String(S.statusColors || "").split(/\n/).forEach(function (line) {
      var p = line.split("::");
      if (p.length === 2 && p[0].trim()) out[p[0].trim()] = p[1].trim();
    });
    return out;
  }
  function colourOf(S, k) { return colours(S)[k] || "#bbbbbb"; }

  DV.create({
    sheetId: SHEET_ID,
    sheetTab: "F3",
    fallback: FALLBACK,
    columns: STATUSES,

    groups: [
      DV.chartTextGroup({
        title: "Top 5 European countries for installed and planned grid-scale battery capacity",
        footer: "Source: [European Energy Storage Inventory, Joint Research Centre](https://ses.jrc.ec.europa.eu/storage-inventory) | Last update: October 2026",
        extra: [
          { key: "unitLabel",  type: "text", def: "GW", help: "Unit after the numbers (axis and tooltip)" },
          { key: "totalLabel", type: "text", def: "Total", help: "Tooltip: total" }
        ]
      }),
      { name: "Status colours", fields: [
        { key: "statusColors", type: "textarea", rows: 6,
          def: "Operational :: #A954D1\nAnnounced :: #FFA3A3\nPermitted :: #F46245\nUnder construction :: #F92B21\nInactive :: #AFA36A",
          help: "One line per status: column name :: #colour (starts from the brand's gas status colours)" }
      ]},
      { name: "Bars", fields: [
        { key: "topN",         type: "range", min: 1, max: 40, step: 1, def: 5, help: "Countries shown (the largest by total capacity)" },
        { key: "legendToggle", type: "check", def: true, help: "Clicking a legend item hides or shows that status" },
        { key: "legendPos",    type: "select", options: ["left", "center", "right"], def: "left", help: "Legend alignment" },
        { key: "rowHeight",    type: "range", min: 24, max: 120, step: 2, def: 64, help: "Height of each country's row in px" },
        { key: "barGap",       type: "range", min: 0, max: 0.7, step: 0.02, def: 0.2, help: "Space between bars, as a share of the row" },
        { key: "labelSize",    type: "range", min: 10, max: 30, step: 0.5, def: 19, help: "Country name size in px" },
        { key: "labelWeight",  type: "select", options: [300, 400, 500, 600, 700, 800, 900], def: 700, help: "Country name boldness" },
        { key: "showTotals",   type: "check", def: false, help: "Show each country's total after its bar" },
        { key: "decimals",     type: "range", min: 0, max: 3, step: 1, def: 1, help: "Decimals in the tooltip" }
      ]},
      { name: "Axis lines", fields: [
        { key: "gridShow",   type: "check", def: true, help: "Show vertical axis lines" },
        { key: "gridValues", type: "text", def: "0, 25, 50, 75, 100", help: "Where to draw them (GW), separated by commas; the axis numbers follow them (empty = automatic)" },
        { key: "gridLineColor", type: "color", def: "#d9d9d9", help: "Axis line colour" }
      ]}
    ],

    build: function (ctx) {
      var S = ctx.S;
      DV.chartText(S);
      var keys = DV.byColumns(ctx.headers, STATUSES);
      var lg = DV.chartLegend({ items: keys.map(function (k) { return { key: k, label: k, color: colourOf(S, k) }; }),
        toggle: S.legendToggle, hidden: hidden, onToggle: function () { ctx.rerender(); } });
      lg.classList.add("dvc-" + S.legendPos);
      var host = document.getElementById("legend"); DV.clear(host); host.appendChild(lg);
    },

    render: function (ctx) {
      var S = ctx.S, P = ctx.P, u = S.unitLabel;
      DV.chartSizes(ctx);
      var w = document.getElementById("panel").clientWidth;
      var keys = DV.byColumns(ctx.headers, STATUSES);
      var full = function (d) { return keys.reduce(function (a, k) { return a + d[k]; }, 0); };
      // the largest countries by total capacity (all statuses), largest first
      var rows = ctx.data.map(function (d, i) { return { d: d, i: i }; })
        .sort(function (a, b) { return (full(b.d) - full(a.d)) || a.i - b.i; }).slice(0, S.topN).map(function (o) { return o.d; });
      var series = keys.filter(function (k) { return !hidden[k]; }).map(function (k) { return { key: k, label: k, color: colourOf(S, k) }; });
      var tot = rows.map(function (d) { return series.reduce(function (a, s) { return a + d[s.key]; }, 0); });
      var ax = DV.niceAxis(Math.max.apply(null, tot), w < 500 ? 3 : 6);
      var lsz = ctx.sz(S.labelSize, 12), lw = 0;
      rows.forEach(function (d) { lw = Math.max(lw, DV.textWidth(d[P], lsz, S.labelWeight)); });
      var picked = String(S.gridValues).split(/[,;\s]+/).filter(function (v) { return v !== "" && isFinite(v); }).map(Number);
      var grid = S.gridShow ? picked : [];
      // the axis numbers follow the chosen lines, and the axis reaches the last one
      if (picked.length) {
        var lastLine = Math.max.apply(null, picked);
        if (Math.max.apply(null, tot) <= lastLine) ax.max = lastLine;
      }
      DV.hbars({ S: S, svg: document.getElementById("chart"), tip: document.getElementById("tip"), width: w, rows: rows,
        label: function (d) { return d[P]; }, labelW: lw + 14, labelSize: lsz, labelWeight: S.labelWeight,
        series: series, xMax: ax.max, tickStep: ax.step, rowH: Math.max(26, S.rowHeight * (w < 500 ? 0.7 : 1)), gap: S.barGap,
        gridValues: grid, gridColor: S.gridLineColor, tickValues: picked, fmtX: function (v) { return DV.fmt(v, u, 0); },
        total: S.showTotals ? function (d, i, t) { return DV.fmt(t, u, 1); } : null, top: 10,
        tooltip: function (i) {
          var h = "<b>" + rows[i][P] + "</b>";
          series.forEach(function (s) { h += DV.tipRow(s.color, s.label, DV.fmt(rows[i][s.key], u, S.decimals)); });
          return h + DV.tipRow("", S.totalLabel, DV.fmt(tot[i], u, S.decimals), "t");
        } });
    }
  });
})();
</script>
</body>
</html>
